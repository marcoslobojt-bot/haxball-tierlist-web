/* ---------- torneo interno ---------- */
const TIERS = ['S','A','B','C','D'];
const tRank = t => { const i = TIERS.indexOf(t); return i<0 ? 9 : i; };
const torneo = () => (DATA||{}).torneo || {};
const tConfig = () => torneo().config || {};
const tJugsArr = () => Object.entries(torneo().jugadores||{}).map(([id,j])=>({id,...j})).sort((a,b)=>tRank(a.tier)-tRank(b.tier)||a.nombre.localeCompare(b.nombre));
const tEquiposArr = () => Object.entries(torneo().equipos||{}).map(([id,e])=>({id,...e})).sort((a,b)=>(a.orden||0)-(b.orden||0));
const tPicksArr = () => Object.entries(torneo().picks||{}).map(([id,x])=>({id,...x})).sort((a,b)=>(a.ts||0)-(b.ts||0));
const tPartidosArr = () => Object.entries(torneo().partidos||{}).map(([id,x])=>({id,...x})).sort((a,b)=>(a.orden??999)-(b.orden??999) || ((a.fecha||'')+(a.hora||'') > (b.fecha||'')+(b.hora||'') ? 1 : -1));
const tJug = id => (torneo().jugadores||{})[id] || {nombre:id, tier:''};
const tEquipo = id => { const e=(torneo().equipos||{})[id]; return e?{id,...e}:null; };
const jugadoresDeEquipo = id => tPicksArr().filter(p=>p.equipo===id).map(p=>({id:p.jugador,...tJug(p.jugador)}));
const ATRIBUTOS = [['sp','Salida / pase'],['po','Posicionamiento'],['pc','Pase / conducción'],['es','Esquineo'],['de','Definición'],['dm','Defensa / marca']];
function statsTorneoJug(jugId){
  let g=0,a=0,pj=0;
  tPartidosArr().forEach(x=>{ const st=(x.stats||{})[jugId]; if(st){ g+=+st.g||0; a+=+st.a||0; pj++; } });
  return {g,a,pj};
}
function cartaJugador(j, opts={}){
  const tot = statsTorneoJug(j.id);
  return `<div class="carta t-${esc(j.tier||'')}">
    <div class="cab"><div>
        <div class="rol">${opts.capitan?'Capitán':'Jugador'}${j.puntoFuerte?' · '+esc(j.puntoFuerte):''}</div>
        <div class="nom">${esc(j.nombre)}</div>
      </div>
      <div style="text-align:right"><div class="med">${esc(j.tier||'?')}</div></div></div>
    <div class="pie"><div><b>${tot.g}</b><span>Goles</span></div><div><b>${tot.a}</b><span>Asist.</span></div><div><b>${tot.pj}</b><span>Partidos</span></div></div>
  </div>`;
}
const tierBadge = t => `<span class="tier t-${esc(t||'')}">${esc(t||'?')}</span>`;
const sinTier = () => tJugsArr().filter(j=>!j.tier);
function mediaTier(t){
  const con = tJugsArr().filter(j=>j.tier===t && +j.media>0);
  if (con.length) return con.reduce((a,j)=>a+ +j.media,0)/con.length;
  return {S:7.2, A:6.6, B:5.4, C:4.3, D:1.4}[t] || 0;
}
const mediaEf = j => +j.media>0 ? +j.media : mediaTier(j.tier);
const estimada = j => !(+j.media>0);
const porMedia = () => tJugsArr().filter(j=>j.tier).sort((a,b)=>mediaEf(b)-mediaEf(a));
function bombosTorneo(){
  const n = tEquiposArr().length || 1, js = porMedia(), out = [];
  for (let i=0;i<js.length;i+=n) out.push(js.slice(i,i+n));
  return out;
}
const capitanes = () => bombosTorneo()[0] || [];
const esCapitan = id => capitanes().some(j=>j.id===id);
const coloresDe = cmd => (String(cmd||'').match(/\b[0-9A-Fa-f]{6}\b/g)||[]);
function camisetasHtml(e){
  const defs = [['titular','Titular'],['suplente','Suplente'],['alternativa','Alternativa']];
  const filas = defs.map(([k,t])=>{
    const cmd = e['camiseta_'+k]; if(!cmd) return '';
    const cols = coloresDe(cmd);
    return `<div class="fila"><span class="n">${t}</span>
      <span class="sw">${cols.map(c=>`<i style="background:#${esc(c)}"></i>`).join('')}</span>
      <button data-copiar="${esc(cmd)}">copiar</button></div>`;
  }).filter(Boolean).join('');
  return filas ? `<div class="camis">${filas}</div>` : '';
}
function plantelesSorteo(){
  const eq = {}; tEquiposArr().forEach(e=>eq[e.id]=[]);
  tPicksArr().forEach(p=>{ if(eq[p.equipo]) eq[p.equipo].push(p.jugador); });
  return eq;
}
function tablaTorneo(){
  const acc = {}; tEquiposArr().forEach(e=>acc[e.id]={id:e.id,nombre:e.nombre,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
  tPartidosArr().filter(x=>x.ga!==undefined&&x.ga!==null&&x.ga!=='').forEach(x=>{
    const A=acc[x.a], B=acc[x.b]; if(!A||!B) return;
    const ga=+x.ga, gb=+x.gb; A.pj++; B.pj++; A.gf+=ga; A.gc+=gb; B.gf+=gb; B.gc+=ga;
    if(ga>gb){A.g++;B.p++;A.pts+=3;} else if(ga<gb){B.g++;A.p++;B.pts+=3;} else {A.e++;B.e++;A.pts++;B.pts++;}
  });
  return Object.values(acc).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);
}

function subnavTorneo(sub){
  const items = [['','Resumen'],['equipos','Equipos'],['sorteo','Sorteo'],['fixture','Fixture'],['reglas','Reglas']];
  return `<div class="subnav">${items.map(([k,t])=>`<a href="#/torneo${k?'/'+k:''}" class="${(sub||'')===k?'on':''}">${esc(t)}</a>`).join('')}</div>`;
}
function headerTorneo(sub){
  const c = tConfig();
  return `<h1 style="font-size:clamp(2.2rem,6vw,3.6rem)">${esc(c.nombre||'Torneo interno')}</h1>
    <p class="muted">${esc(c.descripcion||'Torneo entre jugadores de Prime Haxball, con equipos armados por sorteo equilibrado por tier.')}</p>
`;
}
function pageTorneo(sub){
  if (sub==='equipos') return headerTorneo(sub)+pageTorneoEquipos();
  if (sub==='sorteo') return headerTorneo(sub)+pageTorneoSorteo();
  if (sub==='fixture') return headerTorneo(sub)+pageTorneoFixture();
  if (sub==='reglas') return headerTorneo(sub)+pageTorneoReglas();
  const js = tJugsArr(), eqs = tEquiposArr(), picks = tPicksArr(), st = (torneo().sorteo||{}).estado||'pendiente';
  const falta = sinTier();
  const completo = eqs.length && picks.length >= eqs.length * (+tConfig().porEquipo||4);
  const estado = (st==='corriendo' || st==='fixture') && !completo ? '<span class="vivo"><i></i>Sorteo en vivo</span>'
    : (completo || st==='terminado') ? 'Equipos sorteados' : 'Sorteo pendiente';
  const prox = tPartidosArr().filter(x=>x.ga===undefined||x.ga===null||x.ga==='').slice(0,3);
  return headerTorneo(sub) + `
    <div class="datos">
      <div class="dato"><div class="muted">Anotados</div><div class="v">${js.length}</div><div class="muted">jugadores</div></div>
      <div class="dato"><div class="muted">Equipos</div><div class="v">${eqs.length}</div><div class="muted">de ${esc(tConfig().porEquipo||5)} jugadores</div></div>
      <div class="dato"><div class="muted">Sorteo</div><div class="v" style="font-size:1.2rem;line-height:1.6">${estado}</div><div class="muted">${picks.length} elegidos</div></div>
      ${falta.length?`<div class="dato"><div class="muted">Sin tier</div><div class="v warn">${falta.length}</div><div class="muted">${esc(falta.map(j=>j.nombre).join(', '))}</div></div>`:''}
    </div>
    ${eqs.length&&capitanes().length?`<section><h2>Capitanes</h2><p class="muted">Son los ${eqs.length} de mejor media, el bombo 1, y va uno por equipo.</p>
      <div class="plantel">${capitanes().map(j=>`<div class="jug"><div><b>${esc(j.nombre)}</b><small>media ${estimada(j)?'≈':''}${mediaEf(j).toFixed(2)}</small></div>${tierBadge(j.tier)}</div>`).join('')}</div></section>`:''}
    ${prox.length?`<section><h2>Próximos partidos</h2><div class="lista">${prox.map(cardTorneo).join('')}</div></section>`:''}
    <section><h2>Anotados</h2>${listaAnotados()}</section>`;
}
function listaAnotados(){
  const js = tJugsArr(); if(!js.length) return '<p class="muted">Todavía no hay jugadores anotados.</p>';
  return `<div class="plantel">${js.map(j=>`<div class="jug"><div><b>${esc(j.nombre)}</b><small>${esc(j.discord||'')}</small></div>${tierBadge(j.tier)}</div>`).join('')}</div>`;
}
function pageTorneoEquipos(){
  const eqs = tEquiposArr(); if(!eqs.length) return '<p class="muted">Todavía no hay equipos creados.</p>';
  const pl = plantelesSorteo(), cupo = +tConfig().porEquipo||5;
  return `<div class="equipos">${eqs.map(e=>{
    const ids = pl[e.id]||[];
    const filas = ids.map(id=>`<li><span>${esc(tJug(id).nombre)}${esCapitan(id)?' <span class="tag">C</span>':''}</span>${tierBadge(tJug(id).tier)}</li>`).join('')
      + Array.from({length:Math.max(0,cupo-ids.length)},()=>`<li class="vacio"><span>Libre</span></li>`).join('');
    return `<a class="equipo" href="#/torneo/equipo/${esc(e.id)}" style="--eq:${esc(e.color||'#C9CED6')};text-decoration:none;display:block"><h3>${e.logo?`<img src="${esc(e.logo)}" alt="">`:''}${esc(e.nombre)}</h3><ul>${filas}</ul>${camisetasHtml(e)}</a>`;
  }).join('')}</div>`;
}
function pageTorneoEquipo(id){
  const e = tEquipo(id);
  if (!e) return '<p class="muted">No encontramos ese equipo.</p><p><a href="#/torneo/equipos">Volver a los equipos</a></p>';
  const jug = jugadoresDeEquipo(id);
  const capId = (capitanes().find(c=>jug.some(j=>j.id===c.id))||{}).id;
  const fila = tablaTorneo().find(r=>r.id===id) || {pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0};
  const pos = tablaTorneo().findIndex(r=>r.id===id)+1;
  const ps = tPartidosArr().filter(x=>x.a===id||x.b===id);
  const dg = fila.gf-fila.gc;
  const goleadores = jug.map(j=>({...j,...statsTorneoJug(j.id)})).sort((a,b)=>b.g-a.g||b.a-a.a);
  return `<div class="eq-cab" style="--acento:${esc(e.color||'#C9CED6')}">
      ${e.logo?`<img src="${esc(e.logo)}" alt="">`:`<span class="sinlogo" style="width:112px;height:112px;border-radius:18px;font-size:3rem;--liga:${esc(e.color||'#C9CED6')}">${esc(e.nombre[0])}</span>`}
      <div><h1>${esc(e.nombre)}</h1>
        <p class="muted">${jug.length} jugadores${capId?' · capitán '+esc(tJug(capId).nombre):''}</p>
        ${camisetasHtml(e)}
      </div></div>
    <div class="datos">
      <div class="dato"><div class="muted">Posición</div><div class="v">${pos||'-'}º</div><div class="muted">${fila.pts} puntos</div></div>
      <div class="dato"><div class="muted">Partidos</div><div class="v">${fila.pj}</div><div class="muted">${fila.g}G ${fila.e}E ${fila.p}P</div></div>
      <div class="dato"><div class="muted">Goles</div><div class="v">${fila.gf}</div><div class="muted">${fila.gc} en contra</div></div>
      <div class="dato"><div class="muted">Diferencia</div><div class="v">${dg>0?'+':''}${dg}</div><div class="muted">gol</div></div>
    </div>
    <section><h2>Plantel</h2><div class="cartas">${jug.map(j=>cartaJugador(j,{capitan:j.id===capId})).join('')||'<p class="muted">Sin jugadores sorteados.</p>'}</div></section>
    ${goleadores.some(j=>j.g||j.a)?`<section><h2>Goles y asistencias</h2><div class="scroll"><table class="tabla">
      <thead><tr><th>#</th><th class="l">Jugador</th><th>PJ</th><th>Goles</th><th>Asist.</th></tr></thead><tbody>
      ${goleadores.map((j,i)=>`<tr><td>${i+1}</td><td class="l">${esc(j.nombre)} ${tierBadge(j.tier)}</td><td>${j.pj}</td><td><b>${j.g}</b></td><td>${j.a}</td></tr>`).join('')}
      </tbody></table></div></section>`:''}
    <section><h2>Partidos</h2>${ps.length?`<div class="lista">${ps.map(x=>cardTorneo(x)).join('')}</div>`:'<p class="muted">Sin partidos.</p>'}</section>
    <p style="margin-top:26px"><a class="btn ghost" href="#/torneo/equipos">Volver a los equipos</a></p>`;
}

function pageTorneoSorteo(){
  const s = torneo().sorteo||{}, picks = tPicksArr(), eqs = tEquiposArr();
  const usados = new Set(picks.map(p=>p.jugador));
  const libres = tJugsArr().filter(j=>!usados.has(j.id));
  const ult = picks[picks.length-1];
  const gir = s.girando && Date.now() < (s.girando.hasta||0)+1500 ? s.girando : null;
  const cab = s.estado==='corriendo' ? '<p class="vivo"><i></i>Sorteo en vivo, se actualiza solo</p>'
    : s.estado==='terminado' ? '<p class="muted">El sorteo terminó.</p>' : '<p class="muted">El sorteo todavía no empezó. Cuando arranque, esta página se actualiza sola.</p>';
  const gvs = s.girandoVs && Date.now() < (s.girandoVs.hasta||0)+1500 ? s.girandoVs : null;
  let vivo = '';
  const ultPartido = tPartidosArr().slice(-1)[0];
  const reciénCruce = ultPartido && Date.now() - (ultPartido.ts||0) < 6000;
  if (gvs){
    const eq = torneo().equipos||{};
    const nombres = (gvs.candidatos||[]).map(id=>eq[id]?.nombre||'?');
    vivo = `<div class="sorteo-vivo girando">
      <div class="muted">Fecha ${esc(gvs.fecha)}</div>
      <div class="vs">
        <div class="lado">${eq[gvs.a]?.logo?`<img src="${esc(eq[gvs.a].logo)}" alt="">`:''}<div class="nom">${esc(eq[gvs.a]?.nombre||'?')}</div></div>
        <div class="uve">vs</div>
        <div class="lado incognita"><div class="sombra">?</div>
          <div class="nom" id="ruleta" data-hasta="${esc(gvs.hasta)}" data-nombres='${esc(JSON.stringify(nombres))}'>${esc(nombres[0]||'…')}</div></div>
      </div>
      <div class="ruleta-sub">${nombres.length} rivales posibles</div>
    </div>`;
    setTimeout(()=>{ if(route().a==='torneo') render(); }, Math.max(400, gvs.hasta-Date.now()+1200));
  } else if (reciénCruce){
    const eq = torneo().equipos||{};
    const lado = id => `<div class="lado">${eq[id]?.logo?`<img src="${esc(eq[id].logo)}" alt="">`:''}<div class="nom">${esc(eq[id]?.nombre||'?')}</div></div>`;
    vivo = `<div class="sorteo-vivo nuevo">
      <div class="muted">${esc(ultPartido.ronda||'')}</div>
      <div class="vs">${lado(ultPartido.a)}<div class="uve">vs</div>${lado(ultPartido.b)}</div>
    </div>`;
    setTimeout(()=>{ if(route().a==='torneo') render(); }, 6200);
  } else if (gir){
    const nombres = (gir.candidatos||[]).map(id=>tJug(id).nombre);
    vivo = `<div class="sorteo-vivo girando">
      <div class="muted">Girando para</div>
      <div class="donde">${(torneo().equipos||{})[gir.equipo]?.logo?`<img class="eq-logo" src="${esc((torneo().equipos||{})[gir.equipo].logo)}" alt="" style="vertical-align:-12px;margin-right:8px">`:''}${esc((torneo().equipos||{})[gir.equipo]?.nombre||'?')}</div>
      <div class="quien" id="ruleta" data-hasta="${esc(gir.hasta)}" data-nombres='${esc(JSON.stringify(nombres))}'>${esc(nombres[0]||'…')}</div>
      <div class="ruleta-sub">${nombres.length} en el bombo</div>
    </div>`;
    setTimeout(()=>{ if(route().a==='torneo') render(); }, Math.max(400, gir.hasta-Date.now()+1600));
  } else if (ult){
    const reciente = Date.now() - (ult.ts||0) < 6000;
    vivo = `<div class="sorteo-vivo ${reciente?'nuevo':''}">
      <div class="muted">Último elegido</div>
      <div class="quien">${esc(tJug(ult.jugador).nombre)}</div>
      <div class="donde">${tierBadge(tJug(ult.jugador).tier)} va a ${esc((torneo().equipos||{})[ult.equipo]?.nombre||'?')}</div>
    </div>`;
  }
  const bombos = bombosTorneo().map((b,i)=>{
    const en = b.filter(j=>!usados.has(j.id));
    if (!en.length) return '';
    return `<div class="bombo"><span class="tier t-${i===0?'S':i===1?'A':i===2?'B':'C'}">${i+1}</span>
      <span class="n">${i===0?'capitanes, ':''}${en.length} sin elegir</span>
      ${en.map(j=>`<span class="pill">${esc(j.nombre)} <span class="muted">${estimada(j)?'≈':''}${mediaEf(j).toFixed(2)}</span></span>`).join('')}</div>`;
  }).join('');
  const sin = libres.filter(j=>!j.tier);
  return `${cab}${vivo}
    <section><h2>Bombos</h2>${bombos||'<p class="muted">No queda nadie sin elegir.</p>'}
      ${sin.length?`<div class="aviso" style="margin-top:10px">Sin tier, no entran al sorteo: ${esc(sin.map(j=>j.nombre).join(', '))}</div>`:''}</section>
    <section><h2>Equipos</h2>${pageTorneoEquipos()}</section>
    ${tPartidosArr().length?`<section><h2>Fixture sorteado</h2>${fixtureHtml()}</section>`:''}
    ${picks.length?`<section><h2>Orden del sorteo</h2><div class="scroll"><table class="tabla"><thead><tr><th>#</th><th class="l">Jugador</th><th class="l">Equipo</th></tr></thead><tbody>${
      picks.map((p,i)=>`<tr><td>${i+1}</td><td class="l">${esc(tJug(p.jugador).nombre)} ${tierBadge(tJug(p.jugador).tier)}</td><td class="l">${esc((torneo().equipos||{})[p.equipo]?.nombre||'?')}</td></tr>`).join('')
    }</tbody></table></div></section>`:''}`;
}
function cardTorneo(x, conRonda=true){
  const eq = torneo().equipos||{};
  const jugado = x.ga!==undefined && x.ga!==null && x.ga!=='';
  const centro = jugado ? `<span class="marcador">${esc(x.ga)}–${esc(x.gb)}</span>` : `<span class="hora">${esc(x.hora||'vs')}</span>`;
  const f = x.fecha ? fCorta({fecha:x.fecha,hora:x.hora||'00:00'}) : 'A confirmar';
  const logo = id => eq[id]?.logo ? `<img src="${esc(eq[id].logo)}" alt="" style="width:26px;height:26px;object-fit:contain;vertical-align:-7px;margin:0 6px">` : '';
  return `<article class="partido" style="--liga:var(--silver)">
    ${x.fecha||(conRonda&&x.ronda)?`<div class="meta">${x.fecha?`<span>${esc(f)}</span>`:''}${conRonda&&x.ronda?`<span>${esc(x.ronda)}</span>`:''}</div>`:''}
    <div class="enf"><span class="eq">${logo(x.a)}${esc(eq[x.a]?.nombre||'?')}</span>${centro}<span class="eq">${esc(eq[x.b]?.nombre||'?')}${logo(x.b)}</span></div>
  </article>`;
}
function fixtureHtml(){
  const ps = tPartidosArr();
  if (!ps.length) return '<p class="muted">Todavía no hay partidos.</p>';
  const porFecha = {};
  ps.forEach(x=>{ (porFecha[x.ronda||'Sin fecha'] ||= []).push(x); });
  return Object.entries(porFecha).map(([r,lista])=>`<div class="fecha-bloque"><h3>${esc(r)}</h3><div class="lista">${lista.map(x=>cardTorneo(x,false)).join('')}</div></div>`).join('');
}
function llavesHtml(){
  const tb = tablaTorneo().filter(r=>r.pj>0);
  const n = x => tb[x] ? tb[x].nombre : `${x+1}º de la tabla`;
  return `<div class="bracket">
    <div class="llave"><b>Semifinal 1</b><br>${esc(n(0))} vs ${esc(n(3))}</div>
    <div class="llave"><b>Semifinal 2</b><br>${esc(n(1))} vs ${esc(n(2))}</div>
    <div class="llave"><b>Final</b><br>Ganadores de las semis</div>
  </div>`;
}
function pageTorneoFixture(){
  const ps = tPartidosArr(), tb = tablaTorneo();
  const tabla = tb.length ? `<div class="scroll"><table class="tabla"><thead><tr><th>#</th><th class="l">Equipo</th><th>Pts</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th></tr></thead><tbody>${
    tb.map((r,i)=>`<tr><td>${i+1}</td><td class="l"><a href="#/torneo/equipo/${esc(r.id)}"><span class="mini">${(torneo().equipos||{})[r.id]?.logo?`<img src="${esc((torneo().equipos||{})[r.id].logo)}" alt="">`:''}${esc(r.nombre)}</span></a></td><td><b>${r.pts}</b></td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.gf-r.gc>0?'+':''}${r.gf-r.gc}</td></tr>`).join('')}</tbody></table></div>` : '';
  const c = tConfig();
  const formato = c.formato || `Los ${esc(tEquiposArr().length||8)} equipos juegan todos en el mismo grupo, ${esc(c.fechas||4)} fechas. Clasifican los primeros 4: semifinales 1º contra 4º y 2º contra 3º, y después la final. Los partidos son a dos tiempos de 7 minutos.`;
  return `<div class="texto" style="white-space:pre-wrap">${esc(formato)}</div>
    <section><h2>Partidos</h2>${fixtureHtml()}</section>
    ${tabla?`<section><h2>Posiciones</h2>${tabla}</section>`:''}
    <section><h2>Playoffs</h2>${llavesHtml()}</section>`;
}
function reglasEnTarjetas(txt){
  const t = String(txt||'').trim();
  if (!t) return '';
  const partes = t.split(/\n(?=[ \t]*\d{1,2}[.)-][ \t])/).map(x=>x.trim()).filter(Boolean);
  const items = partes.map(bloque=>{
    const m = bloque.trim().match(/^(\d{1,2})\s*[.)-]\s*(.*)$/s);
    if (!m) return null;
    const resto = m[2].split('\n');
    let titulo = resto.shift().trim(), cuerpo = resto.join('\n').trim();
    if (!cuerpo){ const corte = titulo.match(/^(.{3,46}?)[.:]\s+(.*)$/s); if (corte){ titulo = corte[1]; cuerpo = corte[2]; } }
    return {n:m[1], titulo, cuerpo};
  });
  if (items.some(x=>!x) || items.length < 2) return `<div class="texto">${esc(t)}</div>`;
  return `<div class="reglas-grid">${items.map(x=>`<div class="regla"><div class="num">${esc(x.n)}</div>
    <div><div class="tit">${esc(x.titulo)}</div>${x.cuerpo?`<div class="cue">${esc(x.cuerpo)}</div>`:''}</div></div>`).join('')}</div>`;
}

function pageTorneoReglas(){
  const t = (torneo().reglas||'').trim();
  return t ? reglasEnTarjetas(t) : '<p class="muted">Todavía no se cargaron las reglas del torneo.</p>';
}

/* ---------- router y render ---------- */
function route(){ const h=location.hash.replace(/^#\/?/,''); const [a,b,c]=h.split('/'); return {a:a||'', b, c}; }
function render(){
  const r = route();
  const seccion = r.a==='torneo' ? 'torneo' : (['seleccion','calendario','liga','historico','ss'].includes(r.a) ? 'seleccion' : r.a==='admin' ? 'admin' : 'portal');
  const cur = r.a==='liga' ? 'liga/'+r.b : r.a==='torneo' ? 'torneo'+(r.b==='equipo'?'/equipos':r.b?'/'+r.b:'') : r.a;
  const link = ([k,t]) => `<a href="#/${k}" class="${cur===k?'on':''}">${esc(t)}</a>`;
  let nav = '';
  if (seccion==='seleccion'){
    const sel = [['seleccion','Inicio'],['calendario','Calendario'],...(DATA?ligasArr().map(l=>['liga/'+l.id,l.nombre]):[]),['historico','Histórico'],['ss','Guía del SS']];
    nav = `<a class="volver" href="#/">← Secciones</a><span class="navsep"></span><span class="navsec">Selección</span>${sel.map(link).join('')}`;
  } else if (seccion==='torneo'){
    const tor = [['torneo','Resumen'],['torneo/equipos','Equipos'],['torneo/sorteo','Sorteo'],['torneo/fixture','Fixture'],['torneo/reglas','Reglas']];
    nav = `<a class="volver" href="#/">← Secciones</a><span class="navsep"></span><span class="navsec">Torneo interno</span>${tor.map(link).join('')}`;
  } else if (seccion==='admin'){
    nav = `<a class="volver" href="#/">← Secciones</a>`;
  }
  document.body.dataset.sec = seccion;
  $('#nav').innerHTML = nav + (MODE==='live' && IS_ADMIN ? `<span class="navsep"></span>${link(['admin','Panel'])}` : '');
  let html;
  if (r.a==='admin') html = pageAdmin();
  else if (!DATA) html = MODE==='live' ? `<h2>Sin datos</h2><p class="muted">Un admin tiene que cargar los datos desde <a href="#/admin">el panel</a>.</p>` : '<p class="muted">Cargando…</p>';
  else if (r.a==='calendario') html = pageCalendario();
  else if (r.a==='liga') html = pageLiga(r.b);
  else if (r.a==='ss') html = pageSS();
  else if (r.a==='historico') html = pageHistorico();
  else if (r.a==='torneo') html = r.b==='equipo' ? headerTorneo('equipos')+pageTorneoEquipo(r.c) : pageTorneo(r.b);
  else if (r.a==='seleccion') html = pageInicio();
  else html = pagePortal();
  $('#app').innerHTML = html;
  tick();
  girarRuleta();
}
function tick(){
  const now = Date.now();
  document.querySelectorAll('[data-cd]').forEach(el=>{ const f=falta(+el.dataset.cd-now); el.textContent = f ? `(en ${f})` : '(ya pasó)'; });
  document.querySelectorAll('[data-cdbox]').forEach(el=>{ const ms=+el.dataset.cdbox-now; el.classList.toggle('urg', ms>0 && ms<3*3600e3); });
}
setInterval(tick, 30000);
function girarRuleta(){
  const el = document.getElementById('ruleta');
  if (!el || el.dataset.girando === '1') return;
  let nombres = []; try { nombres = JSON.parse(el.dataset.nombres||'[]'); } catch(e){}
  if (!nombres.length) return;
  el.dataset.girando = '1';
  const hasta = +el.dataset.hasta || (Date.now()+2500);
  let i = Math.floor(Math.random()*nombres.length);
  (function paso(){
    if (!document.body.contains(el)) return;
    const falta = hasta - Date.now();
    if (falta <= 0) return;
    i = (i+1) % nombres.length;
    el.textContent = nombres[i];
    setTimeout(paso, falta > 1500 ? 70 : falta > 800 ? 150 : 300);
  })();
}
window.addEventListener('hashchange', ()=>{ if(!location.hash.startsWith('#/admin')) ADM.edit=null; window.scrollTo(0,0); render(); });

/* ---------- arranque ---------- */
if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'PEGAR_ACA'){
  MODE = 'live';
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database(); auth = firebase.auth();
  db.ref('prime').on('value', s=>{
    DATA = s.val();
    // no pisar un formulario del panel que se está editando
    if (route().a==='admin' && (ADM.edit || (['ligas','planteles','jugadores','tablas','reglas'].includes(ADM.tab) || (ADM.tab==='torneo' && ADM.tsub!=='sorteo') || ADM.tedit)) && DATA && document.querySelector('#app .form')) { return; }
    render();
  }, err=>{ $('#app').innerHTML = `<h2>No se pudo leer la base</h2><p class="muted">${esc(err.message)}</p>`; });
  auth.onAuthStateChanged(async u=>{
    USER = u; IS_ADMIN = false;
    if (u){ try { IS_ADMIN = (await db.ref('config/admins/'+u.uid).get()).val() === true; } catch(e){ IS_ADMIN = false; } }
    render();
  });
} else {
  DATA = SEED;
  render();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Hax</title>
<link rel="icon" href="assets/prime.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --panel:#15181C;
  --panel2:#1D2127;
  --line:#2B3038;
  --silver:#C9CED6;
  --text:#ECEEF1;
  --muted:#8C949E;
  --win:#8FD9AE;
  --loss:#F28B82;
  --warn:#F2C46B;
  --display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.5 var(--body)}
a{color:inherit}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;margin:0;letter-spacing:.01em}
h2{font-size:2rem;margin:0 0 .9rem}
h3{font-size:1.35rem}
p{margin:.4rem 0}
:focus-visible{outline:2px solid var(--silver);outline-offset:3px;border-radius:4px}
.muted{color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* barra superior */
.top{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand img{width:38px;height:38px;object-fit:contain}
.brand b{font-family:var(--display);font-size:1.6rem;font-weight:900}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{text-decoration:none;padding:6px 12px;border-radius:999px;color:var(--muted);white-space:nowrap;font-weight:600}
nav a:hover{color:var(--text)}
nav a.on{background:var(--panel2);color:var(--text)}

main{padding:28px 0 80px}
section{margin-top:44px}

/* botones */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--silver);background:var(--silver);color:#000;font:600 1rem var(--body);text-decoration:none;cursor:pointer}
.btn:hover{background:#fff}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--silver)}
.btn.sm{padding:5px 11px;font-size:.92rem}
.btn.danger{background:transparent;color:var(--loss);border-color:#5a2c2c}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* portada */
.hero{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:
  radial-gradient(120% 90% at 0% 0%,#262B33 0%,transparent 55%),var(--panel)}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--liga,var(--silver))}
.hero-in{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:32px 36px}
.hero .crest{width:clamp(96px,16vw,168px)}
.hero .ctx{color:var(--muted);font-weight:600}
.hero .ctx img{width:22px;height:22px;vertical-align:-5px;margin-right:6px;border-radius:4px}
.hero .versus{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,8.5vw,6rem);line-height:.92;margin:.35rem 0 .5rem;overflow-wrap:anywhere}
.hero .versus span{display:block;font-size:.38em;color:var(--muted);font-weight:700}
.hero .cuando{font-size:1.2rem;font-weight:600}
.cd{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:8px;background:#000;border:1px solid var(--line);font-weight:600}
.cd.urg{border-color:var(--warn);color:var(--warn)}
.hero .score{font-family:var(--display);font-weight:900;font-size:clamp(3rem,10vw,6.5rem);line-height:.9}

.avisos{display:grid;gap:10px}
.aviso{border:1px solid #4a3d22;background:#1b1710;color:#f3dfae;border-radius:10px;padding:12px 16px}
.aviso b{color:#fff}

.ligas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.liga-card{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--liga);border-radius:12px;padding:18px}
.liga-card:hover{border-color:var(--silver);border-top-color:var(--liga)}
.liga-card .head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.liga-card .head img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.liga-card .row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 0 0;margin-top:8px;font-size:.98rem}

/* partidos */
.lista{display:grid;gap:10px}
.partido{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--liga);border-radius:10px;padding:12px 16px}
.partido .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.95rem}
.partido .meta b{color:var(--text);font-weight:600}
.enf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:6px 0 2px}
.enf .eq{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.05}
.enf .eq:last-child{text-align:right}
.enf .eq.nos{color:#fff}
.enf .eq:not(.nos){color:var(--silver)}
.marcador{font-family:var(--display);font-weight:900;font-size:1.9rem;padding:0 6px;white-space:nowrap}
.r-g .marcador{color:var(--win)} .r-p .marcador{color:var(--loss)}
.hora{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--muted)}
.tag{display:inline-block;white-space:nowrap;padding:1px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:.85rem;font-weight:600;color:var(--text)}
.tag.warn{border-color:#5d4a22;color:var(--warn)}
.tag.ok{border-color:#264a35;color:var(--win)}
.tag.bad{border-color:#5a2c2c;color:var(--loss)}
.partido .extra{margin-top:8px;font-size:.98rem}
.partido details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-weight:600}
summary:hover{color:var(--text)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 16px;margin-top:8px;font-size:.95rem}
.checks .si{color:var(--win)} .checks .no{color:var(--muted)}

/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.cal-head h2{margin:0;text-transform:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{padding:6px 8px;color:var(--muted);font-weight:600;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.cal .dia{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.cal .dia.fuera{background:#07080a}
.cal .dia.fuera .n{opacity:.35}
.cal .dia.hoy .n{background:var(--silver);color:#000;border-radius:6px;padding:0 6px}
.cal .n{font-weight:700;align-self:flex-start}
.chip{all:unset;cursor:pointer;display:block;font-size:.85rem;line-height:1.25;padding:3px 6px;border-radius:5px;background:var(--panel2);border-left:3px solid var(--liga);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover,.chip.sel{background:#2b313a}
.chip:focus-visible{outline:2px solid var(--silver)}
.leyenda{display:flex;flex-wrap:wrap;gap:16px;margin:14px 0;color:var(--muted)}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--liga);margin-right:6px;vertical-align:-1px}

/* liga */
.liga-top{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}
.liga-top img{width:104px;height:104px;border-radius:14px;object-fit:cover;border:1px solid var(--line)}
.liga-top h1{font-size:clamp(2.4rem,6vw,3.8rem)}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:22px}
.dato{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.dato .v{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.1}
.dato .v.warn{color:var(--warn)} .dato .v.bad{color:var(--loss)}
.plantel{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.jug{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.jug.pend{border-style:dashed}
.jug b{display:block;font-weight:700}
.jug small{color:var(--muted)}
.reglas{margin:0;padding-left:1.2em;max-width:72ch}
.reglas li{margin:.35rem 0}
.texto{white-space:pre-wrap;max-width:75ch;color:#d4d8de;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:10px}
table.tabla{width:100%;border-collapse:collapse;font-size:.98rem}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tabla th,.tabla td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
.tabla th{color:var(--muted);font-weight:600;background:var(--panel)}
.tabla td:nth-child(2),.tabla th:nth-child(2){text-align:left}
.tabla tr.nos td{background:#1f242b;font-weight:700}

/* guía SS */
.pasos{counter-reset:p;list-style:none;padding:0;margin:0;display:grid;gap:12px;max-width:760px}
.pasos li{counter-increment:p;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.pasos li::before{content:counter(p);font-family:var(--display);font-weight:900;font-size:1.6rem;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line)}

/* admin */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:8px;border:1px solid var(--line);font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--silver);color:#000;border-color:var(--silver)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.form .full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:.92rem;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;font-size:1rem;color:var(--text);background:#000;border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
textarea{min-height:120px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--silver)}
.adm-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--liga);border-radius:8px}
.grid-pl{display:grid;grid-template-columns:1.3fr 1fr .8fr 1.2fr;gap:6px 10px;align-items:center}
.grid-pl .h{color:var(--muted);font-weight:600;font-size:.9rem}
.chk-row{display:grid;grid-template-columns:1fr 70px 70px;gap:6px;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--silver);color:#000;padding:10px 18px;border-radius:8px;font-weight:600;z-index:50}

footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.92rem}

@media (max-width:700px){
  .brand b{display:none}
  .top .wrap{gap:12px}
  .cal-head h2{font-size:1.5rem;text-align:center}
  .hero-in{grid-template-columns:1fr;padding:24px 22px}
  .hero .crest{width:84px}
  .cal .dia{min-height:62px;padding:4px}
  .chip{font-size:0;padding:0;height:8px;border-left-width:0;background:var(--liga);border-radius:4px}
  .cal .dow{padding:4px;font-size:.8rem}
  .liga-top{grid-template-columns:1fr}
  .liga-top img{width:80px;height:80px}
  .grid-pl{grid-template-columns:1fr 1fr}
  .grid-pl .h{display:none}
  .enf .eq{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const REG_AFA = `1. Firmas válidas
Las firmas en el foro deberán realizarse mínimo 30 minutos antes del inicio del partido. Si un jugador firma fuera de tiempo, no estará habilitado para jugar y sus estadísticas no serán contabilizadas.

2. SS obligatoria
Todos los jugadores deben enviar SS del partido. La captura debe mostrar claramente: nick de Haxball, hora exacta y usuario de Discord. Sin SS válida, sus goles y asistencias no contarán.

3. Grabaciones (rec)
Todos los partidos deben ser grabados y enviados. La rec podrá entregarse hasta 2 días después de la fecha del encuentro. No enviarla a tiempo resultará en un empate 0 a 0, sin sumar puntos.

4. Jugadores inhabilitados
Si un equipo juega un segundo con un jugador inhabilitado será DF para el equipo rival.

5. Uniformes
Los equipos deberán usar camisetas oficiales con diferencias claras respecto al rival. Si hay confusión visual, el local deberá cambiar el color de su camiseta.

6. Tiempo reglamentario
Cada encuentro dura 14 minutos totales, divididos en dos tiempos de 7 minutos.

7. Mapas habilitados
Los partidos podrán disputarse en el mapa oficial de la liga o en Bazinga. El uso del mapa oficial no es obligatorio.

8. Cantidad mínima de jugadores
Para iniciar un partido, cada equipo deberá contar con un mínimo de 4 jugadores habilitados. Si un equipo tiene menos de 4, perderá por DF. Si ambos equipos tienen menos de 4 jugadores, el encuentro será reprogramado.

9. Uso del Anti-DF
Cada club contará con 3 Anti-DF por torneo. Solo podrán utilizarse hasta 1 hora antes del partido.

10. Límite de equipos por jugador
Cada jugador podrá formar parte de 1 equipo por división (por ejemplo, 1 en primera y 1 en segunda), nunca dos en la misma división.

11. Solicitud de DF
Para reclamar un DF deberán presentarse pruebas de que el host fue enviado correctamente, que el rival no se presentó y que pasaron al menos 15 minutos desde el envío del host. Antes del minuto 3:30 del segundo tiempo, si uno de los dos equipos queda con menos de 4 jugadores, se puede reclamar DF con pruebas válidas (por ejemplo, la rec).

12. Uso de admin
Solo DT, capitán y subcapitán podrán recibir admin en la sala. Si un jugador sin autorización obtiene admin y comete una infracción, tanto él como el club recibirán doble sanción.

13. Sistema de pausas
Las pausas deberán pedirse escribiendo "P" en una zona segura del campo. Se recomienda avisar varias veces antes de pausar. El tiempo máximo de pausa es de 1 minuto; superado ese límite, el partido deberá continuar.

14. Gol de oro
El partido se deberá terminar al minuto 7:00 exacto. Si hubo una pausa en el segundo tiempo, se deberán jugar 40 segundos exactos de más, salvo que el partido vaya por diferencia de 3 o más.

15. Plantillas oficiales
Cada club podrá registrar hasta 20 jugadores y deberá mantener un mínimo de 9 activos.

16. Cambio de horario
Los admins pueden cambiar el horario, lo que modifica solamente la hora y no el día. Si hay que cambiar el día, se hablará con los capitanes o presidentes.

17. Fixture oficial
Las jornadas y fechas oficiales de cada torneo serán publicadas en el canal fixture correspondiente a cada competición o división.

18. Marcador final
El partido termina cuando se cumple el tiempo reglamentario, siguiendo las normas de la regla 13, o cuando haya diferencia de 7. Si un equipo hace los 7 goles primero, el partido termina y el resultado final es 7 a 0, sin importar la diferencia.`;

const REG_RHL = `Sanciones
Las sanciones serán analizadas por el staff según la circunstancia y la gravedad. Se puede sancionar por fechas o temporadas.

1. Deben firmar 1 hora antes del oficial. Si firman con 50 minutos o menos, la sanción será más grave. Si se repite, o si cancelan y firman varias veces, la sanción será grave.
2. No se puede hacer DU: sanción grave (varias fechas).
3. Si no hacés SS, serán 2 o 3 fechas de sanción. Si se repite varias veces, será más grave.
4. La toxicidad en oficiales o canales públicos es sanción grave.
5. No desvirtuar en los canales, si no serás aislado (sin sanción de fechas).
Las sanciones se reclaman por MD.

DF
1. El DF se cobra 15 minutos después de que se mandó el host al DT y al capitán del rival.
2. Hay que tener 4 SS o más para cobrar DF; si no, será doble DF.
3. Mandar captura sí o sí, indicando el partido y a favor de quién es el DF.
4. Cada equipo tiene un máximo de 4 DF. Al llegar a 2 se avisa; al llegar al máximo, el equipo es expulsado de la liga.

Anti-DF
1. Se debe mandar hasta 2 horas antes de la hora acordada.
2. Hay que taguear a un admin y al DT del otro equipo; si no, no cuenta.
3. Cada equipo tiene un máximo de 3 Anti-DF.

Fair play
1. Si en un host hay un lag considerable, los goles convertidos en ese host no cuentan (lo analizan los admins).
2. Si le va lag a uno o dos jugadores no es necesario cambiar de host, salvo que lo acuerden los dos DT.
3. Si le va lag a un equipo, se repite el oficial en otro host.

Jugadores habilitados
Las reglas del mercado de fichajes se explican en un canal aparte del servidor.`;

let DATA = null, MODE = 'demo', db = null, auth = null, USER = null, IS_ADMIN = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function dt(p){ const [y,m,d]=(p.fecha||'2000-01-01').split('-').map(Number); const [h,mi]=(p.hora||'00:00').split(':').map(Number); return new Date(y,m-1,d,h,mi); }
const hm = d => pad(d.getHours())+':'+pad(d.getMinutes());
const fCorta = p => { const d=dt(p); return `${DIAS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fLarga = p => { const d=dt(p); return `${DIAS_L[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const jugado = p => p.gp !== undefined && p.gp !== null && p.gp !== '';
const resultado = p => !jugado(p) ? null : (+p.gp > +p.gr ? 'g' : +p.gp < +p.gr ? 'p' : 'e');
const ligasArr = () => Object.entries(DATA.ligas||{}).map(([id,l])=>({id,...l})).sort((a,b)=>(a.orden||9)-(b.orden||9));
const partidosArr = () => Object.entries(DATA.partidos||{}).map(([id,p])=>({id,...p})).sort((a,b)=>dt(a)-dt(b));
const liga = id => { const l=(DATA.ligas||{})[id]; return l ? {id,...l} : null; };
const jug = id => (DATA.jugadores||{})[id] || {nombre:id, discord:''};
const cierreFirma = p => new Date(dt(p).getTime() - ((liga(p.liga)||{}).firmaMin||30)*60000);
const plantel = l => Object.entries(l.plantel||{}).map(([id,x])=>({id,...x,...{nombre:jug(id).nombre, discord:x.nick||jug(id).discord}}));
function falta(ms){
  if (ms <= 0) return null;
  const m = Math.ceil(ms/60000);
  if (m < 60) return m+' min';
  const h = Math.floor(m/60), r = m%60;
  if (h < 48) return h+' h'+(r?' '+r+' min':'');
  return Math.round(h/24)+' días';
}
function diasHasta(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,d)-t)/86400000); }

/* ---------- componentes ---------- */
function cardPartido(p, full=true){
  const l = liga(p.liga) || {nombre:'?',color:'#888'};
  const loc = p.condicion === 'local';
  const A = loc ? US : p.rival, B = loc ? p.rival : US;
  const ga = loc ? p.gp : p.gr, gb = loc ? p.gr : p.gp;
  const r = resultado(p);
  const centro = jugado(p) ? `<span class="marcador">${esc(ga)}–${esc(gb)}</span>` : `<span class="hora">${esc(p.hora)}</span>`;
  const meta = [`<b>${esc(l.nombre)}</b>`, p.jornada?`Fecha ${esc(p.jornada)}`:'', `${fCorta(p)} ${esc(p.hora)}`, p.sala?esc(p.sala):''].filter(Boolean).map(x=>`<span>${x}</span>`).join('');
  let extra = '';
  if (jugado(p)) {
    const tags = [];
    if (p.tipo) tags.push(`<span class="tag ${p.tipo==='DF a favor'?'ok':'bad'}">${esc(p.tipo)}</span>`);
    if (p.rec==='pendiente'){ const lim=new Date(dt(p).getTime()+2*86400000); tags.push(`<span class="tag warn">Rec pendiente, vence ${pad(lim.getDate())}/${pad(lim.getMonth()+1)}</span>`); }
    if (p.rec==='enviada') tags.push(`<span class="tag ok">Rec enviada</span>`);
    extra += tags.length ? `<div class="extra">${tags.join(' ')}</div>` : '';
    if (full && (p.goles||p.asist)) extra += `<div class="extra">${p.goles?`Goles: ${esc(p.goles)}`:''}${p.goles&&p.asist?'<br>':''}${p.asist?`Asistencias: ${esc(p.asist)}`:''}</div>`;
    if (full && p.nota) extra += `<div class="extra muted">${esc(p.nota)}</div>`;
  } else {
    const c = cierreFirma(p);
    extra += `<div class="extra">Firmas hasta las <b>${hm(c)}</b> <span class="muted" data-cd="${c.getTime()}"></span></div>`;
    if (full && p.nota) extra += `<div class="extra muted">${esc(p.nota)}</div>`;
    const links = [];
    const lf = liga(p.liga);
    if (lf?.firmaUrl) links.push(`<a class="btn sm" href="${esc(lf.firmaUrl)}" target="_blank" rel="noopener">Firmar</a>`);
    if (p.ssUrl) links.push(`<a class="btn sm ghost" href="${esc(p.ssUrl)}" target="_blank" rel="noopener">Mandar SS</a>`);
    if (full && links.length) extra += `<div class="btns">${links.join('')}</div>`;
    if (full) extra += checklist(p);
  }
  return `<article class="partido ${r?'r-'+r:''}" style="--liga:${esc(l.color)}">
    <div class="meta">${meta}</div>
    <div class="enf"><span class="eq ${A===US?'nos':''}">${esc(A)}</span>${centro}<span class="eq ${B===US?'nos':''}">${esc(B)}</span></div>
    ${extra}</article>`;
}

function checklist(p){
  const l = liga(p.liga); if (!l) return '';
  const ins = plantel(l).filter(j=>j.estado==='inscripto');
  if (!ins.length) return '';
  const f = p.firmas||{}, s = p.ss||{};
  const nf = ins.filter(j=>f[j.id]).length, ns = ins.filter(j=>s[j.id]).length;
  const filas = ins.map(j=>`<div>${esc(j.nombre)}: <span class="${f[j.id]?'si':'no'}">${f[j.id]?'firmó':'sin firma'}</span>, <span class="${s[j.id]?'si':'no'}">${s[j.id]?'SS ok':'sin SS'}</span></div>`).join('');
  return `<details><summary>Firmaron ${nf} y mandaron SS ${ns} de ${ins.length}</summary><div class="checks">${filas}</div></details>`;
}

function avisos(){
  const out = [];
  for (const l of ligasArr()){
    const pl = plantel(l);
    const pend = pl.filter(j=>j.estado==='pendiente');
    const ins = pl.filter(j=>j.estado==='inscripto');
    if (pend.length) out.push(`<div class="aviso"><b>${esc(l.nombre)}:</b> faltan inscribirse ${esc(pend.map(j=>j.nombre).join(', '))}.${l.mercado?' '+esc(l.mercado):''}</div>`);
    else if (l.mercado) out.push(`<div class="aviso"><b>${esc(l.nombre)}:</b> ${esc(l.mercado)}</div>`);
    if (l.cupo && ins.length+pend.length > l.cupo) out.push(`<div class="aviso"><b>${esc(l.nombre)}:</b> hay ${ins.length+pend.length} jugadores para ${l.cupo} lugares. Uno o más van a quedar afuera.</div>`);
    if (l.dfMax && l.dfContra >= 2) out.push(`<div class="aviso"><b>${esc(l.nombre)}:</b> llevamos ${l.dfContra} de ${l.dfMax} DF en contra. Con ${l.dfMax} nos expulsan.</div>`);
  }
  return out.length ? `<div class="avisos">${out.join('')}</div>` : '';
}

function pageCalendario(){
  const ps = partidosArr();
  if (!CAL){
    const ref = ps.find(p=>!jugado(p)) || ps[ps.length-1];
    const d = ref ? dt(ref) : new Date();
    CAL = {y:d.getFullYear(), m:d.getMonth()};
  }
  const first = new Date(CAL.y, CAL.m, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const byDay = {};
  ps.forEach(p=>{ (byDay[p.fecha] ||= []).push(p); });
  let cells = ['lun','mar','mié','jue','vie','sáb','dom'].map(d=>`<div class="dow">${d}</div>`).join('');
  for (let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);

    const chips = (byDay[key]||[]).map(p=>{

    cells += `<div class="dia ${d.getMonth()!==CAL.m?'fuera':''} ${+d===+hoy?'hoy':''}"><span class="n">${d.getDate()}</span>${chips}</div>`;

function tablaHtml(id){
  const raw = (DATA.tablas||{})[id]; if (!raw) return '';
  const rows = raw.split('\n').map(r=>r.split(';').map(x=>x.trim())).filter(r=>r[0]);
  if (!rows.length) return '';
  const body = rows.map((r,i)=>{ const [eq,pts,pj,v,e,d,gf,gc]=r; const dg=(+gf||0)-(+gc||0);
    return `<tr class="${eq===US?'nos':''}"><td>${i+1}</td><td>${esc(eq)}</td><td><b>${esc(pts)}</b></td><td>${esc(pj)}</td><td>${esc(v)}</td><td>${esc(e)}</td><td>${esc(d)}</td><td>${esc(gf)}</td><td>${esc(gc)}</td><td>${dg>0?'+':''}${dg}</td></tr>`; }).join('');
  return `<div class="scroll"><table class="tabla"><thead><tr><th>#</th><th>Equipo</th><th>Pts</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- acciones admin ---------- */
const ref = path => db.ref(path ? 'prime/'+path : 'prime');
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }
const fail = e => { console.error(e); alert('No se pudo guardar: '+(e.message||e)); };

async function guardarPartido(){
  const f = $('#f-partido'), v = n => f.querySelector(`[name=${n}]`).value.trim();
  if (!v('fecha') || !v('rival')) return alert('Completá al menos el día y el rival.');
  const o = {liga:v('liga'), jornada:v('jornada')?+v('jornada'):'', fecha:v('fecha'), hora:v('hora'), sala:v('sala'), rival:v('rival'), condicion:v('condicion'),
    ssUrl:v('ssUrl'), gp:v('gp')===''?null:+v('gp'), gr:v('gr')===''?null:+v('gr'), tipo:v('tipo'), rec:v('rec'), goles:v('goles'), asist:v('asist'), nota:v('nota'), firmas:{}, ss:{}};
  if (o.gp!==null && o.gr===null) o.gr = 0;
  f.querySelectorAll('[data-f]').forEach(c=>{ if(c.checked) o.firmas[c.dataset.f]=true; });
  f.querySelectorAll('[data-s]').forEach(c=>{ if(c.checked) o.ss[c.dataset.s]=true; });
  try { if (ADM.edit==='nuevo') await ref('partidos').push(o); else await ref('partidos/'+ADM.edit).set(o);
    ADM.edit=null; toast('Partido guardado'); render(); } catch(e){ fail(e); }
}

document.addEventListener('change', e=>{
  if (e.target.matches('#f-partido [name=liga]')){ ADM.liga = e.target.value; $('#f-checks').innerHTML = admChecks({liga:e.target.value}); }
});

document.addEventListener('click', async e=>{
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.cal){ CAL.m += +t.dataset.cal; if(CAL.m<0){CAL.m=11;CAL.y--;} if(CAL.m>11){CAL.m=0;CAL.y++;} CAL_SEL=null; return render(); }
  if (t.dataset.sel){ CAL_SEL = t.dataset.sel; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c===t));
    $('#cal-sel').innerHTML = cardPartido({id:CAL_SEL,...DATA.partidos[CAL_SEL]}); tick(); return; }
  if (t.dataset.tab){ ADM.tab=t.dataset.tab; ADM.edit=null; return render(); }
  if (t.dataset.editp){ ADM.edit=t.dataset.editp; return render(); }
  if (t.dataset.pl){ ADM.liga=t.dataset.pl; return render(); }
  if (t.dataset.deljug){ if(!confirm('¿Quitar este jugador de la base y de todos los planteles?')) return;
    const id=t.dataset.deljug, up={['jugadores/'+id]:null}; ligasArr().forEach(l=>up[`ligas/${l.id}/plantel/${id}`]=null);
    try{ await ref('').update(up); toast('Jugador quitado'); render(); }catch(err){fail(err);} return; }
  const a = t.dataset.act; if (!a) return;
  try {
    if (a==='login'){ $('#lg-err').textContent=''; await auth.signInWithEmailAndPassword($('#lg-mail').value.trim(), $('#lg-pass').value); }
    if (a==='login-google'){ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    if (a==='logout'){ await auth.signOut(); }
    if (a==='seed'){ await ref('').set(SEED); toast('Datos iniciales cargados'); }
    if (a==='nuevo-partido'){ ADM.edit='nuevo'; render(); }
    if (a==='cancelar'){ ADM.edit=null; render(); }
    if (a==='guardar-partido') await guardarPartido();
    if (a==='borrar-partido'){ if(confirm('¿Borrar este partido?')){ await ref('partidos/'+ADM.edit).remove(); ADM.edit=null; toast('Partido borrado'); render(); } }
    if (a==='guardar-liga'){ const f=t.closest('[data-liga]'), up={};
      f.querySelectorAll('[name]').forEach(i=>{ up[i.name] = i.type==='number' ? (+i.value||0) : i.value.trim(); });
      await ref('ligas/'+t.dataset.id).update(up); toast('Liga guardada'); }
    if (a==='guardar-plantel'){ const pl={};
      document.querySelectorAll('[data-est]').forEach(s=>{ if(!s.value) return; const id=s.dataset.est; const o={estado:s.value};
        const r=document.querySelector(`[data-rol="${id}"]`).value, n=document.querySelector(`[data-nick="${id}"]`).value.trim();
        if(r) o.rol=r; if(n) o.nick=n; pl[id]=o; });
      await ref(`ligas/${ADM.liga}/plantel`).set(pl); toast('Plantel guardado'); }
    if (a==='agregar-jug'){ const n=$('#nj-n').value.trim(), d=$('#nj-d').value.trim(); if(!n) return alert('Poné el nombre.');
      let id=n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'')||'jugador'; while(DATA.jugadores?.[id]) id+='2';
      await ref('jugadores/'+id).set({nombre:n,discord:d}); toast('Jugador agregado'); render(); }
    if (a==='guardar-jugs'){ const up={};
      document.querySelectorAll('[data-jn]').forEach(i=>{ const id=i.dataset.jn; up[`jugadores/${id}/nombre`]=i.value.trim(); up[`jugadores/${id}/discord`]=document.querySelector(`[data-jd="${id}"]`).value.trim(); });
      await ref('').update(up); toast('Jugadores guardados'); }
    if (a==='guardar-tabla'){ const v=document.querySelector(`[data-tabla="${t.dataset.id}"]`).value.trim(); await ref('tablas/'+t.dataset.id).set(v||null); toast('Tabla guardada'); }
  } catch(err){ if(a==='login'||a==='login-google'){ const el=$('#lg-err'); if(el) el.textContent='No se pudo entrar: revisá el email y la contraseña.'; } else fail(err); }
});

/* ---------- router y render ---------- */
function route(){ const h=location.hash.replace(/^#\/?/,''); const [a,b]=h.split('/'); return {a:a||'', b}; }
function render(){
  const r = route();
  const links = [['','Inicio'],['calendario','Calendario'],...(DATA?ligasArr().map(l=>['liga/'+l.id,l.nombre]):[]),['ss','Guía del SS']];
  if (MODE==='live' && IS_ADMIN) links.push(['admin','Panel']);
  const cur = r.a==='liga' ? 'liga/'+r.b : r.a;
  $('#nav').innerHTML = links.map(([k,t])=>`<a href="#/${k}" class="${cur===k?'on':''}">${esc(t)}</a>`).join('');
  let html;
  if (r.a==='admin') html = pageAdmin();
  else if (!DATA) html = MODE==='live' ? `<h2>Sin datos</h2><p class="muted">Un admin tiene que cargar los datos desde <a href="#/admin">el panel</a>.</p>` : '<p class="muted">Cargando…</p>';
  else if (r.a==='calendario') html = pageCalendario();
  else if (r.a==='liga') html = pageLiga(r.b);
  else if (r.a==='ss') html = pageSS();
  else html = pageInicio();
  $('#app').innerHTML = html;
  tick();
}
function tick(){
  const now = Date.now();
  document.querySelectorAll('[data-cd]').forEach(el=>{ const f=falta(+el.dataset.cd-now); el.textContent = f ? `(cierra en ${f})` : '(ya cerró)'; });
  document.querySelectorAll('[data-cdbox]').forEach(el=>{ const ms=+el.dataset.cdbox-now; el.classList.toggle('urg', ms>0 && ms<3*3600e3); });
}
setInterval(tick, 30000);
window.addEventListener('hashchange', ()=>{ if(!location.hash.startsWith('#/admin')) ADM.edit=null; window.scrollTo(0,0); render(); });

/* ---------- arranque ---------- */
if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'PEGAR_ACA'){
  MODE = 'live';
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database(); auth = firebase.auth();
  db.ref('prime').on('value', s=>{
    DATA = s.val();
    // no pisar un formulario del panel que se está editando
    if (route().a==='admin' && (ADM.edit || ['ligas','planteles','jugadores','tablas'].includes(ADM.tab)) && DATA && document.querySelector('#app .form')) { return; }
    render();
  }, err=>{ $('#app').innerHTML = `<h2>No se pudo leer la base</h2><p class="muted">${esc(err.message)}</p>`; });
  auth.onAuthStateChanged(async u=>{
    USER = u; IS_ADMIN = false;
    if (u){ try { IS_ADMIN = (await db.ref('config/admins/'+u.uid).get()).val() === true; } catch(e){ IS_ADMIN = false; } }
    render();
  });
} else {
  DATA = SEED;
  render();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Hax</title>
<link rel="icon" href="assets/prime.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060A;
  --bg2:#0A0C11;
  --panel:#11141A;
  --panel2:#171B22;
  --line:#232933;
  --line2:#2E3642;
  --silver:#C9CED6;
  --text:#EDEFF2;
  --muted:#868F9B;
  --win:#7FD6A2;
  --loss:#ED8781;
  --warn:#EFC274;
  --acento:#C9CED6;
  --acento2:#8FA2B8;
  --display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --r:14px;
  --sombra:0 18px 40px rgba(0,0,0,.45);
}
body[data-sec="torneo"]{--acento:#E8B860;--acento2:#B8863A}
body[data-sec="seleccion"]{--acento:#C9CED6;--acento2:#7E8EA3}
*{box-sizing:border-box}
html{scroll-padding-top:96px;-webkit-text-size-adjust:100%}
body{margin:0;background:
   radial-gradient(1100px 520px at 50% -180px,rgba(255,255,255,.055),transparent 70%),
   var(--bg);
  color:var(--text);font:400 17px/1.55 var(--body);min-height:100vh}
a{color:inherit}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:.98;margin:0;letter-spacing:.005em}
h1{font-size:clamp(2.6rem,6.5vw,4.2rem)}
h2{font-size:clamp(1.7rem,3.4vw,2.2rem);margin:0 0 16px;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:5px;height:1em;border-radius:3px;background:linear-gradient(180deg,var(--acento),transparent);flex:none}
h3{font-size:1.3rem}
p{margin:.45rem 0}
:focus-visible{outline:2px solid var(--acento);outline-offset:3px;border-radius:6px}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
::selection{background:var(--acento);color:#000}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(5,6,10,.82);backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--acento),transparent);opacity:.35}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:66px;padding-top:9px;padding-bottom:9px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex:none}
.brand img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
.brand b{font-family:var(--display);font-size:1.7rem;font-weight:900;letter-spacing:.01em}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
nav a{text-decoration:none;padding:7px 13px;border-radius:999px;color:var(--muted);white-space:nowrap;font-weight:600;
  transition:color .15s ease,background .15s ease}
nav a:hover{color:var(--text);background:rgba(255,255,255,.05)}
nav a.on{background:var(--acento);color:#06070A}
.navsec{color:var(--acento);font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:0 6px;white-space:nowrap;opacity:.9}
.navsep{width:1px;height:20px;background:var(--line2);margin:0 5px;flex:none}
.volver{color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;padding:6px 2px}
.volver:hover{color:var(--text)}

main{padding:34px 0 90px;animation:entrar .32s ease both}
@keyframes entrar{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
section{margin-top:46px}

/* portada de secciones */
.portal{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:14px}
.puerta{display:block;text-decoration:none;position:relative;overflow:hidden;border-radius:20px;padding:36px 32px 32px;
  background:linear-gradient(160deg,#161A21 0%,#0B0D12 70%);border:1px solid var(--line);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.puerta::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 80% at 85% 0%,rgba(255,255,255,.09),transparent 60%)}
.puerta::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--acento),transparent)}
.puerta:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--sombra)}
.puerta>*{position:relative}
.puerta img{width:88px;margin-bottom:16px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.puerta h2{font-size:clamp(1.9rem,3.8vw,2.7rem);margin-bottom:8px}
.puerta h2::before{display:none}
.puerta .dato-chico{margin-top:16px;font-weight:600;color:var(--acento)}

/* portada de la selección */
.hero{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:linear-gradient(150deg,#171C24 0%,#0A0C11 65%);box-shadow:var(--sombra)}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(180deg,var(--liga,var(--acento)),transparent)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 90% 10%,rgba(255,255,255,.06),transparent 60%);pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;padding:36px 40px;z-index:1}
.hero .crest{width:clamp(96px,15vw,170px);filter:drop-shadow(0 10px 26px rgba(0,0,0,.65))}
.hero .ctx{color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.1em;font-size:.86rem}
.hero .ctx img{width:24px;height:24px;border-radius:6px}
.hero .versus{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,8vw,5.6rem);line-height:.9;margin:.3rem 0 .55rem;overflow-wrap:anywhere}
.hero .versus span{display:block;font-size:.34em;color:var(--muted);font-weight:700;letter-spacing:.02em}
.hero .cuando{font-size:1.15rem;font-weight:600;color:var(--silver)}
.hero .score{font-family:var(--display);font-weight:900;font-size:clamp(3rem,9vw,5.6rem);line-height:.9}
.cd{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 14px;border-radius:10px;
  background:rgba(0,0,0,.55);border:1px solid var(--line2);font-weight:600}
.cd.urg{border-color:var(--warn);color:var(--warn);box-shadow:0 0 22px rgba(239,194,116,.14)}

/* botones */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:10px;border:1px solid var(--acento);
  background:var(--acento);color:#06070A;font:600 1rem var(--body);text-decoration:none;cursor:pointer;
  transition:transform .12s ease,filter .15s ease}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--acento);background:rgba(255,255,255,.04)}
.btn.sm{padding:6px 12px;font-size:.92rem}
.btn.danger{background:transparent;color:var(--loss);border-color:#5C2A2A}
.btn.danger:hover{background:rgba(237,135,129,.08)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* avisos */
.avisos{display:grid;gap:10px}
.aviso{border:1px solid #4A3C22;background:linear-gradient(135deg,#1D1810,#14110C);color:#F2DFAE;border-radius:12px;padding:13px 17px}
.aviso b{color:#fff}

/* tarjetas de liga */
.ligas{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.liga-card{display:block;text-decoration:none;background:linear-gradient(160deg,#141922 0%,#0B0E13 70%);
  border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.liga-card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--liga)}
.liga-card:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--sombra)}
.liga-card .head{display:flex;gap:13px;align-items:center;margin-bottom:14px}
.liga-card .head img,.liga-card .head .sinlogo{width:50px;height:50px;border-radius:10px;object-fit:cover}
.liga-card .row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:9px 0 0;margin-top:9px;font-size:.97rem}
.sinlogo{display:grid;place-items:center;background:var(--panel2);border:1px solid var(--liga,var(--line));color:var(--liga,var(--silver));font-family:var(--display);font-weight:900;font-size:1.6rem}
.liga-top .sinlogo{width:108px;height:108px;border-radius:16px;font-size:3rem}
.ctx .sinlogo{width:24px;height:24px;border-radius:6px;font-size:.9rem;display:inline-grid;vertical-align:-6px}

/* partidos */
.lista{display:grid;gap:11px}
.partido{background:linear-gradient(160deg,#141821 0%,#0C0F14 75%);border:1px solid var(--line);
  border-left:4px solid var(--liga,var(--acento));border-radius:var(--r);padding:14px 18px;transition:border-color .15s ease}
.partido:hover{border-color:var(--line2);border-left-color:var(--liga,var(--acento))}
.partido .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.88rem;text-transform:uppercase;letter-spacing:.07em}
.partido .meta b{color:var(--text);font-weight:700}
.enf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin:8px 0 2px}
.enf .eq{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.05;display:flex;align-items:center;gap:8px}
.enf .eq:last-child{text-align:right;justify-content:flex-end}
.enf .eq.nos{color:#fff}
.enf .eq:not(.nos){color:var(--silver)}
.eq-logo,.enf .eq img{width:28px;height:28px;object-fit:contain}
.marcador{font-family:var(--display);font-weight:900;font-size:2rem;padding:2px 12px;white-space:nowrap;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px}
.r-g .marcador{color:var(--win);border-color:rgba(127,214,162,.3)}
.r-p .marcador{color:var(--loss);border-color:rgba(237,135,129,.3)}
.hora{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--muted)}
.tag{display:inline-block;white-space:nowrap;padding:2px 9px;border-radius:7px;background:var(--panel2);
  border:1px solid var(--line2);font-size:.82rem;font-weight:600;letter-spacing:.04em}
.tag.warn{border-color:#5B4722;color:var(--warn)}
.tag.ok{border-color:#265139;color:var(--win)}
.tag.bad{border-color:#5B2A2A;color:var(--loss)}
.partido .extra{margin-top:9px;font-size:.97rem}
.partido details{margin-top:9px}
summary{cursor:pointer;color:var(--muted);font-weight:600}
summary:hover{color:var(--text)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:5px 16px;margin-top:9px;font-size:.95rem}
.checks .si{color:var(--win)} .checks .no{color:var(--muted)}

/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.cal-head h2{margin:0}
.cal-head h2::before{display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.cal .dow{padding:8px 10px;color:var(--muted);font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.cal .dia{min-height:108px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.cal .dia.fuera{background:#07080B}
.cal .dia.fuera .n{opacity:.32}
.cal .dia.hoy{box-shadow:inset 0 0 0 1px var(--acento)}
.cal .dia.hoy .n{background:var(--acento);color:#06070A;border-radius:7px;padding:0 7px}
.cal .n{font-weight:700;align-self:flex-start}
.chip{all:unset;cursor:pointer;display:block;font-size:.84rem;line-height:1.3;padding:4px 7px;border-radius:7px;
  background:var(--panel2);border-left:3px solid var(--liga);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover,.chip.sel{background:#2B323D}
.chip:focus-visible{outline:2px solid var(--acento)}
.leyenda{display:flex;flex-wrap:wrap;gap:18px;margin:16px 0;color:var(--muted);font-size:.95rem}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--liga);margin-right:7px;vertical-align:-1px}

/* cabecera de liga */
.liga-top{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:4px 0 26px;border-bottom:1px solid var(--line)}
.liga-top img{width:108px;height:108px;border-radius:16px;object-fit:cover;border:1px solid var(--line2);background:#0A0C11}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:26px}
.dato{background:linear-gradient(160deg,#141821 0%,#0C0F14 75%);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.dato .muted{font-size:.82rem;text-transform:uppercase;letter-spacing:.1em}
.dato .v{font-family:var(--display);font-weight:900;font-size:1.9rem;line-height:1.15;color:var(--acento)}
.dato .v.warn{color:var(--warn)} .dato .v.bad{color:var(--loss)}

/* plantel */
.plantel{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.jug{background:linear-gradient(160deg,#141821 0%,#0C0F14 75%);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.jug.pend{border-style:dashed;opacity:.85}
.jug b{display:block;font-weight:700}
.jug small{color:var(--muted)}

/* reglas */
.reglas{margin:0;padding-left:1.25em;max-width:74ch}
.reglas li{margin:.4rem 0}
.reglas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.regla{display:grid;grid-template-columns:46px 1fr;gap:14px;background:linear-gradient(160deg,#141821 0%,#0C0F14 75%);
  border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.regla .num{font-family:var(--display);font-weight:900;font-size:2rem;line-height:1;color:var(--acento);text-align:center}
.regla .tit{font-family:var(--display);font-weight:800;font-size:1.25rem;margin-bottom:4px}
.regla .cue{color:#B7BEC7;font-size:.98rem;line-height:1.45}
.texto{white-space:pre-wrap;max-width:76ch;color:#C2C8D0;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 20px;margin-top:10px}

/* tablas */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2)}
table.tabla{width:100%;border-collapse:collapse;font-size:.97rem}
.tabla th,.tabla td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line)}
.tabla th{color:var(--muted);font-weight:700;background:var(--panel);text-transform:uppercase;font-size:.78rem;letter-spacing:.09em;position:sticky;top:0}
.tabla tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
.tabla tbody tr:hover{background:rgba(255,255,255,.04)}
.tabla td:nth-child(2),.tabla th:nth-child(2),.tabla td.l,.tabla th.l{text-align:left}
.tabla tr.nos td{background:rgba(201,206,214,.07);font-weight:700;box-shadow:inset 3px 0 0 var(--acento)}
.tabla tr:last-child td{border-bottom:0}

/* guía del SS */
.pasos{counter-reset:p;list-style:none;padding:0;margin:0;display:grid;gap:14px;max-width:780px}
.pasos li{counter-increment:p;display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start}
.pasos li::before{content:counter(p);font-family:var(--display);font-weight:900;font-size:1.7rem;width:48px;height:48px;
  border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);color:var(--acento)}

/* torneo */
.tier{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 7px;border-radius:8px;
  font-family:var(--display);font-weight:900;font-size:1.05rem;background:rgba(255,255,255,.04);
  border:1px solid var(--t,var(--line2));color:var(--t,var(--muted))}
.t-S{--t:#C4A2FF} .t-A{--t:#8FD9AE} .t-B{--t:#E5CE85} .t-C{--t:#E8A87A} .t-D{--t:#E8807A}
.equipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.equipo{background:linear-gradient(160deg,#141821 0%,#0B0E13 75%);border:1px solid var(--line);border-radius:16px;
  padding:0 0 14px;overflow:hidden;transition:transform .16s ease,border-color .16s ease}
.equipo:hover{transform:translateY(-2px);border-color:var(--line2)}
.equipo h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:14px 16px;font-size:1.22rem;
  background:linear-gradient(90deg,rgba(255,255,255,.07),transparent);border-bottom:1px solid var(--line);
  box-shadow:inset 0 3px 0 var(--eq,var(--acento))}
.equipo h3 img{width:34px;height:34px;object-fit:contain}
.equipo ul{list-style:none;margin:0;padding:0 16px;display:grid;gap:7px}
.equipo li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.equipo li:last-child{border-bottom:0}
.equipo li.vacio{color:var(--muted)}
.camis{margin:12px 16px 0;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:7px}
.camis .fila{display:flex;align-items:center;gap:9px;font-size:.9rem}
.camis .sw{display:flex;gap:2px}
.camis .sw i{width:15px;height:17px;border-radius:4px;border:1px solid rgba(255,255,255,.3);display:block}
.camis .n{color:var(--muted);min-width:82px;text-transform:uppercase;letter-spacing:.07em;font-size:.78rem}
.camis button{all:unset;cursor:pointer;color:var(--muted);font-size:.84rem;text-decoration:underline}
.camis button:hover{color:var(--text)}

/* cartas de jugador */
.cartas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.carta{position:relative;overflow:hidden;background:linear-gradient(165deg,#1A1F28 0%,#0A0D12 72%);
  border:1px solid var(--line);border-radius:18px;padding:18px}
.carta::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 80% 0%,var(--t,rgba(255,255,255,.1)),transparent 65%);opacity:.22}
.carta>*{position:relative}
.carta .cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.carta .med{font-family:var(--display);font-weight:900;font-size:3rem;line-height:1;color:var(--t,var(--acento))}
.carta .nom{font-family:var(--display);font-weight:800;font-size:1.5rem;margin-top:2px;overflow-wrap:anywhere}
.carta .rol{color:var(--muted);font-size:.86rem;text-transform:uppercase;letter-spacing:.09em}
.carta .barras{display:grid;gap:7px;margin-top:14px}
.carta .b{display:grid;grid-template-columns:96px 1fr 34px;gap:9px;align-items:center;font-size:.82rem;color:var(--muted)}
.carta .b .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.carta .b .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--t,var(--acento)),rgba(255,255,255,.25))}
.carta .b .val{color:var(--text);font-weight:700;text-align:right}
.carta .pie{display:flex;gap:16px;margin-top:14px;border-top:1px solid var(--line);padding-top:11px;font-size:.9rem}
.carta .pie b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:900;color:var(--text);line-height:1}
.carta .pie span{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}
.eq-cab{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--line)}
.eq-cab img{width:112px;height:112px;object-fit:contain}
.tabla td .mini{display:flex;align-items:center;gap:9px}
.tabla td .mini img{width:24px;height:24px;object-fit:contain}
.tabla a{text-decoration:none}
.tabla a:hover{color:var(--acento)}
/* sorteo en vivo */
.sorteo-vivo{background:linear-gradient(160deg,#161B24 0%,#0A0D12 70%);border:1px solid var(--line);border-radius:20px;
  padding:30px 32px;text-align:center;box-shadow:var(--sombra);position:relative;overflow:hidden}
.sorteo-vivo::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 0%,rgba(255,255,255,.07),transparent 65%);pointer-events:none}
.sorteo-vivo .muted{text-transform:uppercase;letter-spacing:.16em;font-size:.8rem}
.sorteo-vivo .quien{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,7.5vw,4.6rem);line-height:1}
.sorteo-vivo .donde{font-size:1.2rem;color:var(--silver);font-weight:600}
.sorteo-vivo.girando{border-color:var(--warn);box-shadow:0 0 0 1px rgba(239,194,116,.22),0 20px 50px rgba(0,0,0,.5)}
.sorteo-vivo.girando .quien{color:var(--warn);animation:latir .62s ease-in-out infinite}
.sorteo-vivo.nuevo{border-color:var(--acento);box-shadow:0 0 44px rgba(201,206,214,.18)}
.sorteo-vivo.nuevo .quien{animation:aparecer .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes aparecer{0%{transform:scale(.55);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.ruleta-sub{color:var(--muted);margin-top:8px;font-size:.95rem}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin-top:10px;position:relative}
.vs .lado{display:grid;justify-items:center;gap:10px;min-width:0}
.vs .lado img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6))}
.vs .lado .nom{font-family:var(--display);font-weight:900;font-size:clamp(1.4rem,3.4vw,2.6rem);line-height:1.05;text-align:center;overflow-wrap:anywhere}
.vs .uve{font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,4vw,3rem);color:var(--muted)}
.vs .lado.incognita .nom{color:var(--warn)}
.vs .lado.incognita .sombra{width:92px;height:92px;border-radius:16px;border:2px dashed var(--warn);display:grid;place-items:center;font-family:var(--display);font-size:2.8rem;color:var(--warn)}
.bombos{display:grid;gap:10px;margin-top:14px}
.bombo{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.bombo .n{color:var(--muted);font-size:.93rem;margin-right:4px}
.pill{padding:4px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.91rem}
.vivo{display:inline-flex;align-items:center;gap:8px;color:var(--loss);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.86rem}
.vivo i{width:9px;height:9px;border-radius:50%;background:var(--loss);display:inline-block;box-shadow:0 0 0 0 rgba(237,135,129,.6);animation:pulso 1.6s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 10px rgba(237,135,129,0)}100%{box-shadow:0 0 0 0 rgba(237,135,129,0)}}
.fecha-bloque{background:linear-gradient(160deg,#12161D 0%,#0A0D12 75%);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px}
.fecha-bloque h3{margin:0 0 13px;font-size:1.45rem;color:var(--acento);text-transform:uppercase;letter-spacing:.06em}
.bracket{display:grid;gap:11px;max-width:640px}
.bracket .llave{background:linear-gradient(160deg,#141821 0%,#0C0F14 75%);border:1px solid var(--line);

/* subnav del panel */

const REG_AFA = `1. Firmas válidas
Las firmas en el foro deberán realizarse mínimo 30 minutos antes del inicio del partido. Si un jugador firma fuera de tiempo, no estará habilitado para jugar y sus estadísticas no serán contabilizadas.

2. SS obligatoria
Todos los jugadores deben enviar SS del partido. La captura debe mostrar claramente: nick de Haxball, hora exacta y usuario de Discord. Sin SS válida, sus goles y asistencias no contarán.

3. Grabaciones (rec)
Todos los partidos deben ser grabados y enviados. La rec podrá entregarse hasta 2 días después de la fecha del encuentro. No enviarla a tiempo resultará en un empate 0 a 0, sin sumar puntos.

4. Jugadores inhabilitados
Si un equipo juega un segundo con un jugador inhabilitado será DF para el equipo rival.

5. Uniformes
Los equipos deberán usar camisetas oficiales con diferencias claras respecto al rival. Si hay confusión visual, el local deberá cambiar el color de su camiseta.

6. Tiempo reglamentario
Cada encuentro dura 14 minutos totales, divididos en dos tiempos de 7 minutos.

7. Mapas habilitados
Los partidos podrán disputarse en el mapa oficial de la liga o en Bazinga. El uso del mapa oficial no es obligatorio.

8. Cantidad mínima de jugadores
Para iniciar un partido, cada equipo deberá contar con un mínimo de 4 jugadores habilitados. Si un equipo tiene menos de 4, perderá por DF. Si ambos equipos tienen menos de 4 jugadores, el encuentro será reprogramado.

9. Uso del Anti-DF
Cada club contará con 3 Anti-DF por torneo. Solo podrán utilizarse hasta 1 hora antes del partido.

10. Límite de equipos por jugador
Cada jugador podrá formar parte de 1 equipo por división (por ejemplo, 1 en primera y 1 en segunda), nunca dos en la misma división.

11. Solicitud de DF
Para reclamar un DF deberán presentarse pruebas de que el host fue enviado correctamente, que el rival no se presentó y que pasaron al menos 15 minutos desde el envío del host. Antes del minuto 3:30 del segundo tiempo, si uno de los dos equipos queda con menos de 4 jugadores, se puede reclamar DF con pruebas válidas (por ejemplo, la rec).

12. Uso de admin
Solo DT, capitán y subcapitán podrán recibir admin en la sala. Si un jugador sin autorización obtiene admin y comete una infracción, tanto él como el club recibirán doble sanción.

13. Sistema de pausas
Las pausas deberán pedirse escribiendo "P" en una zona segura del campo. Se recomienda avisar varias veces antes de pausar. El tiempo máximo de pausa es de 1 minuto; superado ese límite, el partido deberá continuar.

14. Gol de oro
El partido se deberá terminar al minuto 7:00 exacto. Si hubo una pausa en el segundo tiempo, se deberán jugar 40 segundos exactos de más, salvo que el partido vaya por diferencia de 3 o más.

15. Plantillas oficiales
Cada club podrá registrar hasta 20 jugadores y deberá mantener un mínimo de 9 activos.

16. Cambio de horario
Los admins pueden cambiar el horario, lo que modifica solamente la hora y no el día. Si hay que cambiar el día, se hablará con los capitanes o presidentes.

17. Fixture oficial
Las jornadas y fechas oficiales de cada torneo serán publicadas en el canal fixture correspondiente a cada competición o división.

18. Marcador final
El partido termina cuando se cumple el tiempo reglamentario, siguiendo las normas de la regla 13, o cuando haya diferencia de 7. Si un equipo hace los 7 goles primero, el partido termina y el resultado final es 7 a 0, sin importar la diferencia.`;

const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function dt(p){ const [y,m,d]=(p.fecha||'2000-01-01').split('-').map(Number); const [h,mi]=(p.hora||'00:00').split(':').map(Number); return new Date(y,m-1,d,h,mi); }
const hm = d => pad(d.getHours())+':'+pad(d.getMinutes());
const fCorta = p => { const d=dt(p); return `${DIAS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const fLarga = p => { const d=dt(p); return `${DIAS_L[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const jugado = p => p.gp !== undefined && p.gp !== null && p.gp !== '';
const resultado = p => !jugado(p) ? null : (+p.gp > +p.gr ? 'g' : +p.gp < +p.gr ? 'p' : 'e');
const ligasArr = () => Object.entries(DATA.ligas||{}).map(([id,l])=>({id,...l})).sort((a,b)=>(a.orden||9)-(b.orden||9));
const partidosArr = () => Object.entries(DATA.partidos||{}).map(([id,p])=>({id,...p})).sort((a,b)=>dt(a)-dt(b));
const liga = id => { const l=(DATA.ligas||{})[id]; return l ? {id,...l} : null; };
const jug = id => (DATA.jugadores||{})[id] || {nombre:id, discord:''};
const logoImg = (l,cls='') => l.logo ? `<img ${cls?`class="${cls}" `:''}src="${esc(l.logo)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sinlogo '+this.className,textContent:'${esc((l.nombre||'?')[0])}',style:'--liga:${esc(l.color)}'}))">` : `<span class="sinlogo ${cls}" style="--liga:${esc(l.color)}">${esc((l.nombre||'?')[0])}</span>`;
const firmaMin = p => { const l=liga(p.liga); return l && l.firmaMin!==undefined && l.firmaMin!=='' ? +l.firmaMin : 30; };
const cierreFirma = p => new Date(dt(p).getTime() - firmaMin(p)*60000);
const plantel = l => Object.entries(l.plantel||{}).map(([id,x])=>({id,...x,...{nombre:jug(id).nombre, discord:x.nick||jug(id).discord}}));
function falta(ms){
  if (ms <= 0) return null;
  const m = Math.ceil(ms/60000);
  if (m < 60) return m+' min';
  const h = Math.floor(m/60), r = m%60;
  if (h < 48) return h+' h'+(r?' '+r+' min':'');
  return Math.round(h/24)+' días';
}
function diasHasta(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,d)-t)/86400000); }

/* ---------- componentes ---------- */
function cardPartido(p, full=true){
  const l = liga(p.liga) || {nombre:'?',color:'#888'};
  const loc = p.condicion === 'local';
  const A = loc ? US : p.rival, B = loc ? p.rival : US;
  const ga = loc ? p.gp : p.gr, gb = loc ? p.gr : p.gp;
  const r = resultado(p);
  const centro = jugado(p) ? `<span class="marcador">${esc(ga)}–${esc(gb)}</span>` : `<span class="hora">${esc(p.hora)}</span>`;
  const meta = [`<b>${esc(l.nombre)}</b>`, p.jornada?`Fecha ${esc(p.jornada)}`:'', `${fCorta(p)} ${esc(p.hora)}`, p.sala?esc(p.sala):''].filter(Boolean).map(x=>`<span>${x}</span>`).join('');
  let extra = '';
  if (jugado(p)) {
    const tags = [];
    if (p.tipo) tags.push(`<span class="tag ${p.tipo==='DF a favor'?'ok':'bad'}">${esc(p.tipo)}</span>`);
    if (p.rec==='pendiente'){ const lim=new Date(dt(p).getTime()+2*86400000); tags.push(`<span class="tag warn">Rec pendiente, vence ${pad(lim.getDate())}/${pad(lim.getMonth()+1)}</span>`); }
    if (p.rec==='enviada') tags.push(`<span class="tag ok">Rec enviada</span>`);
    extra += tags.length ? `<div class="extra">${tags.join(' ')}</div>` : '';
    const t = statsTxt(p);
    if (full && (t.g||t.a)) extra += `<div class="extra">${t.g?`Goles: ${esc(t.g)}`:''}${t.g&&t.a?'<br>':''}${t.a?`Asistencias: ${esc(t.a)}`:''}</div>`;
    if (full && p.nota) extra += `<div class="extra muted">${esc(p.nota)}</div>`;
    if (full && p.informe) extra += `<div class="btns"><button class="btn sm" data-informe="${esc(p.id)}">Ver informe del partido</button><button class="btn sm ghost" data-informe-dl="${esc(p.id)}">Descargar PDF</button></div>`;
    if (full && p.replay) extra += `<div class="btns"><a class="btn sm" href="replay.html?id=${encodeURIComponent(p.id)}">▶ Ver repetición</a><button class="btn sm ghost" data-replay="${esc(p.id)}">Descargar .hbr2</button></div>`;
  } else {
    const c = cierreFirma(p);
    extra += firmaMin(p) ? `<div class="extra">Firmas hasta las <b>${hm(c)}</b> <span class="muted" data-cd="${c.getTime()}"></span></div>`
      : `<div class="extra">Se firma en la sala. Empieza a las <b>${esc(p.hora)}</b> <span class="muted" data-cd="${c.getTime()}"></span></div>`;
    if (full && p.nota) extra += `<div class="extra muted">${esc(p.nota)}</div>`;
    const links = [];
    const lf = liga(p.liga);
    if (lf?.firmaUrl) links.push(`<a class="btn sm" href="${esc(lf.firmaUrl)}" target="_blank" rel="noopener">Firmar</a>`);
    if (p.ssUrl) links.push(`<a class="btn sm ghost" href="${esc(p.ssUrl)}" target="_blank" rel="noopener">Mandar SS</a>`);
    if (full && links.length) extra += `<div class="btns">${links.join('')}</div>`;
  }
  return `<article class="partido ${r?'r-'+r:''}" style="--liga:${esc(l.color)}">
    <div class="meta">${meta}</div>
    <div class="enf"><span class="eq ${A===US?'nos':''}">${esc(A)}</span>${centro}<span class="eq ${B===US?'nos':''}">${esc(B)}</span></div>
    ${extra}</article>`;
}

function statsTxt(p){
  const st = p.stats||{}, ids = Object.keys(st);
  if (!ids.length) return {g:p.goles||'', a:p.asist||''};
  const f = k => ids.filter(id=>+st[id][k]>0).sort((x,y)=>st[y][k]-st[x][k]).map(id=>jug(id).nombre+(st[id][k]>1?' x'+st[id][k]:'')).join(', ');
  return {g:f('g'), a:f('a')};
}
function statsJug(ligaId){
  const acc = {};
  partidosArr().filter(p=>!ligaId||p.liga===ligaId).forEach(p=>Object.entries(p.stats||{}).forEach(([id,x])=>{
    const a = acc[id] ||= {g:0,a:0,pj:0}; a.g += +x.g||0; a.a += +x.a||0; a.pj++; }));
  return acc;
}
function tablaStats(ligaId){
  const rows = Object.entries(statsJug(ligaId)).filter(([,x])=>x.g||x.a).sort((a,b)=>b[1].g-a[1].g||b[1].a-a[1].a);
  if (!rows.length) return '<p class="muted">Todavía no hay goles ni asistencias cargados.</p>';
  return `<div class="scroll"><table class="tabla"><thead><tr><th>#</th><th>Jugador</th><th>Goles</th><th>Asist.</th><th>G+A</th></tr></thead><tbody>${
    rows.map(([id,x],i)=>`<tr><td>${i+1}</td><td>${esc(jug(id).nombre)}</td><td><b>${x.g}</b></td><td>${x.a}</td><td>${x.g+x.a}</td></tr>`).join('')}</tbody></table></div>`;
}

function avisos(){
  const out = [];
  for (const l of ligasArr()){
    const pl = plantel(l);
    const pend = pl.filter(j=>j.estado==='pendiente');
    const ins = pl.filter(j=>j.estado==='inscripto');
    if (pend.length) out.push(`<div class="aviso"><b>${esc(l.nombre)}:</b> faltan anotarse ${esc(pend.map(j=>j.nombre).join(', '))}.${l.mercado?' '+esc(l.mercado):''}</div>`);
    else if (l.mercado) out.push(`<div class="aviso"><b>${esc(l.nombre)}:</b> ${esc(l.mercado)}</div>`);
    if (l.cupo && ins.length+pend.length > l.cupo) out.push(`<div class="aviso"><b>${esc(l.nombre)}:</b> hay ${ins.length+pend.length} jugadores para ${l.cupo} lugares. Uno o más van a quedar afuera.</div>`);
    if (l.dfMax && l.dfContra >= 2) out.push(`<div class="aviso"><b>${esc(l.nombre)}:</b> llevamos ${l.dfContra} de ${l.dfMax} DF en contra. Con ${l.dfMax} nos expulsan.</div>`);
  }
  return out.length ? `<div class="avisos">${out.join('')}</div>` : '';
}

/* ---------- páginas ---------- */
function pagePortal(){
  const ps = partidosArr(), now = Date.now();
  const prox = ps.find(p => !jugado(p) && dt(p).getTime() > now - 3*3600e3);
  const st = (torneo().sorteo||{}).estado||'pendiente';
  const eqs = tEquiposArr().length, anot = tJugsArr().length;
  const tTxt = st==='corriendo' ? '<span class="vivo"><i></i>Sorteo en vivo ahora</span>'
    : st==='terminado' ? `${eqs} equipos sorteados` : `${anot} anotados, sorteo pendiente`;
  const sTxt = prox ? `Próximo: ${esc(prox.rival)}, ${fCorta(prox)} ${esc(prox.hora)}` : 'Fixture, planteles y resultados de las ligas';
  return `<div class="portal">
    <a class="puerta" href="#/seleccion">
      <img src="assets/prime.png" alt="">
      <h2>Selección Prime Haxball</h2>
      <p class="muted">El equipo en las ligas: ${esc(ligasArr().map(l=>l.nombre).join(', '))||'sin ligas cargadas'}.</p>
      <p class="dato-chico">${sTxt}</p>
    </a>
    <a class="puerta" href="#/torneo" style="--acento:#E8B860">
      <img src="assets/prime.png" alt="">
      <h2>Torneo interno</h2>
      <p class="muted">${esc(tConfig().descripcion||'Torneo entre nosotros, con equipos sorteados y equilibrados por tier.')}</p>
      <p class="dato-chico">${tTxt}</p>
    </a>
  </div>`;
}

function pageInicio(){
  const ps = partidosArr(), now = Date.now();
  const prox = ps.find(p => !jugado(p) && dt(p).getTime() > now - 3*3600e3);
  let hero;
  if (prox){
    const l = liga(prox.liga), c = cierreFirma(prox);
    const btn = [l?.firmaUrl?`<a class="btn" href="${esc(l.firmaUrl)}" target="_blank" rel="noopener">Firmar</a>`:'', prox.ssUrl?`<a class="btn ghost" href="${esc(prox.ssUrl)}" target="_blank" rel="noopener">Mandar SS</a>`:'', `<a class="btn ghost" href="#/liga/${esc(prox.liga)}">Ver ${esc(l?.nombre)}</a>`].join('');
    hero = `<div class="hero" style="--liga:${esc(l?.color)}"><div class="hero-in">
      <img class="crest" src="assets/prime.png" alt="Escudo de Prime Hax">
      <div>
        <div class="ctx">${logoImg(l||{})}Próximo partido en ${esc(l?.nombre)}, fecha ${esc(prox.jornada||'')}</div>
        <div class="versus"><span>${prox.condicion==='local'?'Recibimos a':'Visitamos a'}</span>${esc(prox.rival)}</div>
        <div class="cuando">${fLarga(prox)}, ${esc(prox.hora)}${prox.sala?' en '+esc(prox.sala):''}</div>
        <div class="cd" data-cdbox="${c.getTime()}">${firmaMin(prox)?`Firmas hasta las ${hm(c)}`:`Se firma en la sala, empieza ${esc(prox.hora)}`} <span data-cd="${c.getTime()}"></span></div>
        <div class="btns">${btn}</div>
      </div></div></div>`;
  } else {
    const ult = [...ps].reverse().find(jugado);
    if (ult){
      const l = liga(ult.liga), r = resultado(ult);
      const txt = r==='g'?'Ganamos':r==='p'?'Perdimos':'Empatamos';
      hero = `<div class="hero" style="--liga:${esc(l?.color)}"><div class="hero-in">
        <img class="crest" src="assets/prime.png" alt="Escudo de Prime Hax">
        <div>
          <div class="ctx">${logoImg(l||{})}Último partido, ${esc(l?.nombre)}</div>
          <div class="versus"><span>${txt} contra</span>${esc(ult.rival)}</div>
          <div class="score">${esc(ult.gp)}–${esc(ult.gr)}${ult.tipo?` <span class="tag">${esc(ult.tipo)}</span>`:''}</div>
          <p class="muted">Todavía no hay próximos partidos cargados. Las ligas publican el fixture cada semana.</p>
        </div></div></div>`;
    } else {
      hero = `<div class="hero"><div class="hero-in"><img class="crest" src="assets/prime.png" alt=""><div><div class="versus">Prime Hax</div><p class="muted">Todavía no hay partidos cargados.</p></div></div></div>`;
    }
  }
  const cards = ligasArr().map(l=>{
    const pl = ps.filter(p=>p.liga===l.id);
    const u = [...pl].reverse().find(jugado), n = pl.find(p=>!jugado(p));
    const uTxt = u ? `${esc(u.gp)}–${esc(u.gr)} vs ${esc(u.rival)}` : 'Sin partidos';
    const nTxt = n ? `${fCorta(n)} ${esc(n.hora)} vs ${esc(n.rival)}` : 'A confirmar';
    return `<a class="liga-card" href="#/liga/${esc(l.id)}" style="--liga:${esc(l.color)}">
      <div class="head">${logoImg(l)}<div><h3>${esc(l.nombre)}</h3><span class="muted">${esc(l.division)}${l.formato?', '+esc(l.formato):''}</span></div></div>
      <div class="row"><span class="muted">Último</span><span>${uTxt}</span></div>
      <div class="row"><span class="muted">Próximo</span><span>${nTxt}</span></div></a>`;
  }).join('');
  const recientes = ps.filter(jugado).reverse().slice(0,6).map(p=>cardPartido(p,false)).join('');
  const av = avisos();
  return `${hero}
    ${av?`<section><h2>Avisos</h2>${av}</section>`:''}
    <section><h2>Ligas</h2><div class="ligas">${cards}</div></section>
    ${recientes?`<section><h2>Resultados</h2><div class="lista">${recientes}</div></section>`:''}`;
}

function pageCalendario(){
  const ps = partidosArr();
  if (!CAL){
    const ref = ps.find(p=>!jugado(p)) || ps[ps.length-1];
    const d = ref ? dt(ref) : new Date();
    CAL = {y:d.getFullYear(), m:d.getMonth()};
  }
  const first = new Date(CAL.y, CAL.m, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const byDay = {};
  ps.forEach(p=>{ (byDay[p.fecha] ||= []).push(p); });
  let cells = ['lun','mar','mié','jue','vie','sáb','dom'].map(d=>`<div class="dow">${d}</div>`).join('');
  for (let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if (i>=35 && d.getMonth()!==CAL.m) break;
    const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const chips = (byDay[key]||[]).map(p=>{
      const l = liga(p.liga)||{};
      const r = jugado(p) ? ` ${p.gp}–${p.gr}` : ` ${p.hora}`;
      return `<button class="chip ${CAL_SEL===p.id?'sel':''}" style="--liga:${esc(l.color)}" data-sel="${esc(p.id)}" title="${esc(l.nombre)}: ${esc(p.rival)}${esc(r)}">${esc(l.nombre)}${esc(r)}</button>`;
    }).join('');
    cells += `<div class="dia ${d.getMonth()!==CAL.m?'fuera':''} ${+d===+hoy?'hoy':''}"><span class="n">${d.getDate()}</span>${chips}</div>`;
  }
  const leyenda = ligasArr().map(l=>`<span style="--liga:${esc(l.color)}"><i></i>${esc(l.nombre)}</span>`).join('');
  const sel = CAL_SEL && DATA.partidos?.[CAL_SEL] ? cardPartido({id:CAL_SEL,...DATA.partidos[CAL_SEL]}) : '';
  const delMes = ps.filter(p=>{const d=dt(p);return d.getMonth()===CAL.m&&d.getFullYear()===CAL.y;});
  return `<div class="cal-head"><button class="btn ghost sm" data-cal="-1" aria-label="Mes anterior">Anterior</button>
      <h2>${MESES[CAL.m][0].toUpperCase()+MESES[CAL.m].slice(1)} ${CAL.y}</h2>
      <button class="btn ghost sm" data-cal="1" aria-label="Mes siguiente">Siguiente</button></div>
    <div class="cal">${cells}</div>
    <div class="leyenda">${leyenda}</div>
    <div id="cal-sel">${sel || (delMes.length ? '<p class="muted">Tocá un partido para ver el detalle.</p>' : '<p class="muted">No hay partidos cargados este mes.</p>')}</div>
    ${delMes.length?`<section><h2>Partidos del mes</h2><div class="lista">${delMes.map(p=>cardPartido(p)).join('')}</div></section>`:''}`;
}

function pageLiga(id){
  const l = liga(id);
  if (!l) return `<h2>No encontramos esa liga</h2><p><a href="#/">Volver al inicio</a></p>`;
  const pl = plantel(l);
  const ins = pl.filter(j=>j.estado==='inscripto'), pend = pl.filter(j=>j.estado==='pendiente');
  const rolOrden = {DT:0,C:1,SC:2};
  ins.sort((a,b)=>(rolOrden[a.rol]??9)-(rolOrden[b.rol]??9) || a.nombre.localeCompare(b.nombre));
  const jHtml = (j,cls='') => `<div class="jug ${cls}"><div><b>${esc(j.nombre)}</b><small>${esc(j.discord)}</small></div>${j.rol?`<span class="tag">${esc(j.rol==='C'?'Capitán':j.rol==='SC'?'Subcapitán':j.rol)}</span>`:''}${cls?'<span class="tag warn">Falta anotarse</span>':''}</div>`;
  const reg = (DATA.reglamentos||{})[l.reglamento];
  const serv = (DATA.servidor||{})[l.servidor];
  const ps = partidosArr().filter(p=>p.liga===id);
  const prox = ps.filter(p=>!jugado(p)), jug_ = ps.filter(jugado).reverse();
  const total = ins.length + pend.length;
  const datos = [
    `<div class="dato"><div class="muted">Firma</div><div class="v">${l.firmaMin?esc(l.firmaMin>=60?(l.firmaMin/60)+' h':l.firmaMin+' min'):'En la sala'}</div><div class="muted">${l.firmaMin?'antes del partido':'antes de empezar'}</div></div>`,
    `<div class="dato"><div class="muted">Plantel</div><div class="v ${l.cupo&&total>l.cupo?'warn':''}">${ins.length}${l.cupo?' / '+l.cupo:''}</div><div class="muted">${pend.length?(pend.length===1?'falta anotarse 1':'faltan anotarse '+pend.length):'anotados'}</div></div>`,
    `<div class="dato"><div class="muted">Anti-DF usados</div><div class="v">${esc(l.antiDfUsados||0)} / ${esc(l.antiDfMax||0)}</div><div class="muted">en el torneo</div></div>`,
    l.dfMax ? `<div class="dato"><div class="muted">DF en contra</div><div class="v ${l.dfContra>=2?'bad':''}">${esc(l.dfContra||0)} / ${esc(l.dfMax)}</div><div class="muted">con ${esc(l.dfMax)} nos expulsan</div></div>` : ''
  ].join('');
  const tabla = tablaHtml(id);
  return `<div class="liga-top" style="--liga:${esc(l.color)}">
      ${logoImg(l)}
      <div><h1>${esc(l.nombreLargo||l.nombre)}</h1>
        <p class="muted">${esc(l.division)}${l.formato?', '+esc(l.formato):''}</p>
        <div class="btns">
          ${l.discord?`<a class="btn" href="${esc(l.discord)}" target="_blank" rel="noopener">Unirme al Discord</a>`:''}
          ${l.firmaUrl?`<a class="btn ghost" href="${esc(l.firmaUrl)}" target="_blank" rel="noopener">Ir al canal de firmas</a>`:''}
        </div>
        <p class="muted">El canal de firmas solo abre si ya estás dentro del servidor.</p>
      </div></div>
    ${l.mercado?`<div class="aviso" style="margin-top:18px">${esc(l.mercado)}</div>`:''}
    <div class="datos">${datos}</div>
    ${reg?.clave?.length?`<section><h2>Lo que no te podés olvidar</h2><ul class="reglas">${reg.clave.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></section>`:''}
    ${prox.length?`<section><h2>Próximos partidos</h2><div class="lista">${prox.map(p=>cardPartido(p)).join('')}</div></section>`:''}
    <section><h2>Plantel</h2>
      <div class="plantel">${ins.map(j=>jHtml(j)).join('')}${pend.map(j=>jHtml(j,'pend')).join('')}</div>
      ${l.cupo&&total>l.cupo?`<div class="aviso" style="margin-top:12px">Hay ${total} jugadores para ${l.cupo} lugares.</div>`:''}
    </section>
    <section><h2>Goles y asistencias</h2>${tablaStats(id)}</section>
    ${jug_.length?`<section><h2>Resultados</h2><div class="lista">${jug_.map(p=>cardPartido(p)).join('')}</div></section>`:''}
    ${tabla?`<section><h2>Posiciones</h2>${tabla}</section>`:''}
    ${reg||serv?`<section><h2>Reglamento</h2>
      ${reg?`<details><summary>${esc(reg.titulo)}</summary><div style="margin-top:12px">${reglasEnTarjetas(reg.texto)}</div></details>`:''}
      ${serv?`<details style="margin-top:10px"><summary>Reglas del servidor</summary><ul class="reglas texto" style="white-space:normal;padding-left:2em">${serv.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details>`:''}
    </section>`:''}`;
}

function tablaHtml(id){
  const raw = (DATA.tablas||{})[id]; if (!raw) return '';
  const rows = raw.split('\n').map(r=>r.split(';').map(x=>x.trim())).filter(r=>r[0]);
  if (!rows.length) return '';
  const body = rows.map((r,i)=>{ const [eq,pts,pj,v,e,d,gf,gc]=r; const dg=(+gf||0)-(+gc||0);
    return `<tr class="${eq===US?'nos':''}"><td>${i+1}</td><td>${esc(eq)}</td><td><b>${esc(pts)}</b></td><td>${esc(pj)}</td><td>${esc(v)}</td><td>${esc(e)}</td><td>${esc(d)}</td><td>${esc(gf)}</td><td>${esc(gc)}</td><td>${dg>0?'+':''}${dg}</td></tr>`; }).join('');
  return `<div class="scroll"><table class="tabla"><thead><tr><th>#</th><th>Equipo</th><th>Pts</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function pageHistorico(){
  const ls = ligasArr(), ps = partidosArr().filter(jugado);
  const rec = ps => { const r={pj:0,g:0,e:0,p:0,gf:0,gc:0}; ps.forEach(p=>{ r.pj++; r.gf+=+p.gp; r.gc+=+p.gr; r[resultado(p)]++; }); return r; };
  const fila = (n,r,cls='') => { const dg=r.gf-r.gc; return `<tr class="${cls}"><td class="l">${n}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td>${dg>0?'+':''}${dg}</td></tr>`; };
  const equipo = `<div class="scroll"><table class="tabla"><thead><tr><th class="l">Liga</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th></tr></thead><tbody>${
    ls.map(l=>fila(esc(l.nombre),rec(ps.filter(p=>p.liga===l.id)))).join('')}${fila('Total',rec(ps),'nos')}</tbody></table></div>`;
  const por = Object.fromEntries(ls.map(l=>[l.id,statsJug(l.id)]));
  const tot = statsJug();
  const rows = Object.entries(tot).filter(([,x])=>x.g||x.a).sort((a,b)=>b[1].g-a[1].g||b[1].a-a[1].a);
  const jugs = rows.length ? `<div class="scroll"><table class="tabla"><thead><tr><th>#</th><th>Jugador</th>${ls.map(l=>`<th>${esc(l.nombre)}<br><small>G / A</small></th>`).join('')}<th>Goles</th><th>Asist.</th></tr></thead><tbody>${
    rows.map(([id,x],i)=>`<tr><td>${i+1}</td><td>${esc(jug(id).nombre)}</td>${ls.map(l=>{const y=por[l.id][id]; return `<td>${y?y.g+' / '+y.a:'–'}</td>`;}).join('')}<td><b>${x.g}</b></td><td>${x.a}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="muted">Todavía no hay goles ni asistencias cargados.</p>';
  return `<h1 style="font-size:clamp(2.4rem,6vw,3.6rem)">Histórico</h1>
    <p class="muted">Todo lo que jugó Prime Hax, sumando las tres ligas.</p>
    <section><h2>Resultados del equipo</h2>${equipo}</section>
    <section><h2>Goles y asistencias</h2>${jugs}</section>`;
}

function rondasTodosContraTodos(ids){
  const t = [...ids]; if (t.length%2) t.push(null);
  const n = t.length, rondas = [];
  for (let r=0;r<n-1;r++){
    const pares = [];
    for (let i=0;i<n/2;i++){ const a=t[i], b=t[n-1-i]; if(a&&b) pares.push(r%2 ? [b,a] : [a,b]); }
    rondas.push(pares);
    t.splice(1,0,t.pop());
  }
  return rondas;
}
const mezclar = arr => arr.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const esperar = ms => new Promise(r=>setTimeout(r,ms));

const clavePar = (a,b) => [a,b].sort().join('|');
function puedeCompletar(restantes, jugados){
  if (restantes.length < 2) return true;
  const [x, ...resto] = restantes;
  for (const y of resto){
    if (jugados.has(clavePar(x,y))) continue;
    if (puedeCompletar(resto.filter(z=>z!==y), jugados)) return true;
  }
  return false;
}

async function sortearUnPartido(){
  const eqs = tEquiposArr(), n = eqs.length;
  if (n < 2) { alert('Creá los equipos primero.'); return false; }
  const porFecha = Math.floor(n/2), fechas = Math.max(1, +tConfig().fechas||4);
  const ps = tPartidosArr();
  const jugados = new Set(ps.map(x=>clavePar(x.a,x.b)));
  let f = 1;
  while (f <= fechas && ps.filter(x=>x.ronda==='Fecha '+f).length >= porFecha) f++;
  if (f > fechas){ await ref('torneo/sorteo').set({estado:'terminado'}); return false; }
  const enFecha = new Set(ps.filter(x=>x.ronda==='Fecha '+f).flatMap(x=>[x.a,x.b]));
  const libres = mezclar(eqs.map(e=>e.id).filter(id=>!enFecha.has(id)));
  if (libres.length < 2) return false;
  const a = libres[0];
  let cand = libres.slice(1).filter(y=>{
    if (jugados.has(clavePar(a,y))) return false;
    const resto = libres.filter(z=>z!==a && z!==y);
    return puedeCompletar(resto, jugados);
  });
  if (!cand.length) cand = libres.slice(1);
  await ref('torneo/sorteo').set({estado:'fixture', girandoVs:{fecha:f, a, candidatos:cand, hasta:Date.now()+3200}});
  await esperar(3200);
  const b = cand[Math.floor(Math.random()*cand.length)];
  await db.ref('prime/torneo/partidos').push({a, b, ronda:'Fecha '+f, orden:ps.length, ts:Date.now()});
  await ref('torneo/sorteo').set({estado:'fixture'});
  return true;
}

async function sortearFixture(){
  const eqs = tEquiposArr();
  if (eqs.length < 2) return alert('Creá los equipos primero.');
  await ref('torneo/partidos').remove();
  await esperar(400);
  ADM.autoFx = true;
  while (ADM.autoFx){
    const sigue = await sortearUnPartido();
    if (!sigue) break;
    await esperar(1300);
  }
  ADM.autoFx = null;
  toast('Fixture sorteado');
}

async function sorteoSiguiente(){
  const eqs = tEquiposArr();
  if (eqs.length < 2) { alert('Creá los equipos primero.'); return false; }
  const picks = tPicksArr();
  const cupo = (+tConfig().porEquipo||5) * eqs.length;
  if (picks.length >= cupo){ await ref('torneo/sorteo').update({estado:'terminado'}); return false; }
  const n = picks.length, ronda = Math.floor(n/eqs.length), idx = n%eqs.length;
  const orden = ronda%2 ? [...eqs].reverse() : eqs;
  const equipo = orden[idx];
  const usados = new Set(picks.map(p=>p.jugador));
  const libres = tJugsArr().filter(j=>!usados.has(j.id) && j.tier);
  if (!libres.length){ await ref('torneo/sorteo').update({estado:'terminado'}); return false; }
  const bombosAll = bombosTorneo();
  let bombo = (bombosAll[ronda]||[]).filter(j=>!usados.has(j.id));
  if (!bombo.length) bombo = libres;
  if (!bombo.length){ await ref('torneo/sorteo').update({estado:'terminado'}); return false; }
  const elegido = bombo[Math.floor(Math.random()*bombo.length)];
  const dura = 3200;
  await ref('torneo/sorteo').set({estado:'corriendo', girando:{equipo:equipo.id, candidatos:bombo.map(j=>j.id), hasta:Date.now()+dura}});
  await new Promise(r=>setTimeout(r, dura));
  await db.ref('prime/torneo/picks').push({equipo:equipo.id, jugador:elegido.id, ts:Date.now()});
  await ref('torneo/sorteo').set({estado:'corriendo'});
  return true;
}

function achicarImagen(file, lado=128){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => { const im = new Image();
      im.onload = () => { const c = document.createElement('canvas'); c.width = c.height = lado;
        const ctx = c.getContext('2d'); const esc2 = Math.min(lado/im.width, lado/im.height);
        const w = im.width*esc2, h = im.height*esc2;
        ctx.drawImage(im, (lado-w)/2, (lado-h)/2, w, h);
        res(c.toDataURL('image/webp', 0.85)); };
      im.onerror = () => rej(new Error('No se pudo leer la imagen'));
      im.src = r.result; };
    r.onerror = () => rej(new Error('No se pudo leer el archivo'));
    r.readAsDataURL(file);
  });
}

function fileB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=()=>rej(new Error('No se pudo leer el archivo')); r.readAsDataURL(file); }); }

async function guardarPartido(){
  const f = $('#f-partido'), v = n => f.querySelector(`[name=${n}]`).value.trim();
  if (!v('fecha') || !v('rival')) return alert('Completá al menos el día y el rival.');
  const id = ADM.edit==='nuevo' ? ref('partidos').push().key : ADM.edit;
  const prev = (DATA.partidos||{})[id] || {};
  const o = {liga:v('liga'), jornada:v('jornada')?+v('jornada'):'', fecha:v('fecha'), hora:v('hora'), sala:v('sala'), rival:v('rival'), condicion:v('condicion'),
    ssUrl:v('ssUrl'), gp:v('gp')===''?null:+v('gp'), gr:v('gr')===''?null:+v('gr'), tipo:v('tipo'), rec:v('rec'), nota:v('nota'), stats:{}};
  if (o.gp!==null && o.gr===null) o.gr = 0;
  f.querySelectorAll('[data-g]').forEach(i=>{ const j=i.dataset.g, g=+i.value||0, a=+f.querySelector(`[data-a="${j}"]`).value||0; if(g||a) o.stats[j]={g,a}; });
  const file = f.querySelector('[name=replayFile]').files[0];
  const quitar = f.querySelector('[name=replayDel]')?.checked;
  try {
    if (file){
      if (file.size > 8e6) return alert('La repetición pesa más de 8 MB.');
      toast('Subiendo repetición…');
      await db.ref('replays/'+id).set({name:file.name, data:await fileB64(file)});
      o.replay = {name:file.name, size:file.size};
    } else if (quitar){ await db.ref('replays/'+id).remove(); }
    else if (prev.replay) o.replay = prev.replay;
    const inf = f.querySelector('[name=informeFile]').files[0];
    const quitarInf = f.querySelector('[name=informeDel]')?.checked;
    if (inf){
      if (inf.type && inf.type !== 'application/pdf') return alert('El informe tiene que ser un PDF.');
      if (inf.size > 6e6) return alert('El informe pesa más de 6 MB.');
      toast('Subiendo informe…');
      await db.ref('informes/'+id).set({name:inf.name, data:await fileB64(inf)});
      o.informe = {name:inf.name, size:inf.size, subido:Date.now()};
    } else if (quitarInf){ await db.ref('informes/'+id).remove(); }
    else if (prev.informe) o.informe = prev.informe;
    await ref('partidos/'+id).set(o);
    ADM.edit=null; toast('Partido guardado'); render();
  } catch(e){ fail(e); }
}

async function bajarReplay(id){
  if (!db) return alert('Las repeticiones se descargan desde el sitio publicado.');
  const v = (await db.ref('replays/'+id).get()).val();
  if (!v) return alert('No se encontró la repetición de este partido.');
  const bin = atob(v.data), u8 = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([u8],{type:'application/octet-stream'}));
  const a = document.createElement('a'); a.href=url; a.download=v.name||'repeticion.hbr2'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

async function blobInforme(id){
  if (!db) throw new Error('Los informes se ven desde el sitio publicado.');
  const v = (await db.ref('informes/'+id).get()).val();
  if (!v) throw new Error('No se encontró el informe de este partido.');
  const bin = atob(v.data), u8 = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return {url:URL.createObjectURL(new Blob([u8],{type:'application/pdf'})), name:v.name||'informe.pdf'};
}
function bajarBlob(url,name){ const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
async function verInforme(id){
  const w = window.open('', '_blank');           // se abre en el click para que no lo bloquee el navegador
  if (w) w.document.write('<p style="font-family:sans-serif;padding:20px">Cargando informe…</p>');
  try {
    const {url,name} = await blobInforme(id);
    if (w) w.location.href = url; else bajarBlob(url,name);
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  } catch(err){ if (w) w.close(); throw err; }
}
async function bajarInforme(id){ const {url,name} = await blobInforme(id); bajarBlob(url,name); setTimeout(()=>URL.revokeObjectURL(url),5000); }
